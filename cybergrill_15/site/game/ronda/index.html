  },
  neon: {
    key: 'neon', icon: '✨', name: 'NEÓN',
    card: '#0d1230', ink: '#cfe0ff', frame: 'rgba(150,170,255,.7)',
    red: '#ff2f7a', blue: '#22e6ff', gold: '#ffd23c', deep: '#7a5f00',
    face: '#ffe3c4', hatch: .35,
    suit: { o: '#ffd23c', c: '#ff2f7a', e: '#22e6ff', b: '#9cff2e' },
    glow: true
  }
};
let deckTheme = 'classic';
const D = () => DECKS[deckTheme] || DECKS.classic;

/* n copies of a little bit of drawing, which is most of what an engraving is */
const rep = (n, f) => { let s = ''; for (let i = 0; i < n; i++) s += f(i); return s; };
/* the fine parallel strokes that give a printed card its shading */
const shade = (P, d) => '<path fill="none" stroke-width=".62" stroke-opacity="' + P.hatch + '" d="' + d + '"/>';

/* --------------------------------------------------------------------------
   bastos -- a lopped branch. Red and blue by turn on the real cards, each
   with three cut-off stubs and a knot at the foot.
   -------------------------------------------------------------------------- */
function baton(P, alt, big) {
  const body = alt ? P.blue : P.red;
  const stub = alt ? P.red : P.blue;
  const club =
    '<path fill="' + body + '" d="M0,-17.5 C4.5,-17.5 6,-13.4 5.7,-9 C5.3,-3.6 3.8,1.6 3.1,7.2 ' +
    'L2.5,13.4 C2.3,15.4 -2.3,15.4 -2.5,13.4 L-3.1,7.2 C-3.8,1.6 -5.3,-3.6 -5.7,-9 ' +
    'C-6,-13.4 -4.5,-17.5 0,-17.5 Z"/>' +
    rep(4, i => shade(P, 'M' + (-3.2 + i * 2.1) + ',-15.4 C' + (-3.9 + i * 2.4) +
      ',-9.6 ' + (-3.4 + i * 2.1) + ',-3.6 ' + (-2.6 + i * 1.7) + ',3'));
  /* the cut branch stubs: a short arm, a dark eye, a flame of colour */
  const knots =
    '<g><circle cx="-3.9" cy="-4.4" r="2.1" fill="' + stub + '"/>' +
    '<circle cx="-3.9" cy="-4.4" r=".85" fill="' + P.ink + '" stroke="none"/></g>' +
    '<g><circle cx="3.8" cy="2.2" r="2.1" fill="' + stub + '"/>' +
    '<circle cx="3.8" cy="2.2" r=".85" fill="' + P.ink + '" stroke="none"/></g>' +
    '<g><circle cx="-3" cy="9" r="1.9" fill="' + stub + '"/>' +
    '<circle cx="-3" cy="9" r=".78" fill="' + P.ink + '" stroke="none"/></g>';
  /* the ace on the real deck throws out branches, each ending in a flame */
  const branch = (x, y, dx, dy, col) =>
    '<path fill="' + body + '" d="M' + x + ',' + y + ' q' + (dx * .55) + ',' + (dy * .8) + ' ' +
    dx + ',' + dy + ' l' + (-dx * .16) + ',' + (-dy * .34) + ' q' + (-dx * .45) + ',' +
    (-dy * .5) + ' ' + (-dx * .86) + ',' + (-dy * .5) + ' Z"/>' +
    '<path fill="' + col + '" d="M' + (x + dx) + ',' + (y + dy) + ' q2.6,-1 3.4,-3.4 ' +
    'q-3.2,.3 -4.6,2.2 Z"/>';
  const arms = big
    ? branch(-4.2, -6, -6.6, -3.6, P.gold) + branch(4.2, .4, 6.6, -3.6, P.gold) +
      branch(-3.4, 7.6, -6.4, -3.2, P.gold)
    : '';
  return '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    arms + club + knots + '</g>';
}

/* --------------------------------------------------------------------------
   espadas -- a blue blade, a gold crescent guard, a red hatched grip and a
   stacked pommel. They point up and down by turn, as they are printed.
   -------------------------------------------------------------------------- */
function sword(P, alt) {
  const g = '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    '<path fill="' + P.blue + '" d="M0,-16 L2.4,-12.2 L2.4,2.4 L-2.4,2.4 L-2.4,-12.2 Z"/>' +
    shade(P, 'M0,-13.6 L0,1.6') +
    /* the crescent guard, knobbed at both ends */
    '<path fill="' + P.gold + '" d="M-7.6,5.8 C-6.4,2 -3.4,.9 0,.9 C3.4,.9 6.4,2 7.6,5.8 ' +
    'C5.6,4.1 3,3.4 0,3.4 C-3,3.4 -5.6,4.1 -7.6,5.8 Z"/>' +
    '<circle cx="-7.5" cy="5.7" r="1.5" fill="' + P.gold + '"/>' +
    '<circle cx="7.5" cy="5.7" r="1.5" fill="' + P.gold + '"/>' +
    /* the grip */
    '<path fill="' + P.red + '" d="M-2.7,3.8 C-3.8,7.2 -3.6,10.8 -2.3,13 L2.3,13 ' +
    'C3.6,10.8 3.8,7.2 2.7,3.8 Z"/>' +
    rep(4, i => shade(P, 'M-3,' + (5.2 + i * 1.9) + ' L3,' + (4.4 + i * 1.9))) +
    /* the pommel */
    '<circle cx="0" cy="14.8" r="2.1" fill="' + P.gold + '"/>' +
    '<circle cx="0" cy="17.3" r="1.3" fill="' + P.gold + '"/>' +
    '</g>';
  return alt ? '<g transform="rotate(180)">' + g + '</g>' : g;
}

/* --------------------------------------------------------------------------
   oros -- a gold coin, a ring of teeth biting inwards, an eight-pointed star
   struck in the middle.
   -------------------------------------------------------------------------- */
function coin(P, big) {
  const N = 16, R = 8.8, r = 6.1;
  const pt = (rad, ang) => (rad * Math.cos(ang)).toFixed(2) + ',' + (rad * Math.sin(ang)).toFixed(2);
  let teeth = '';
  for (let i = 0; i < N; i++) {
    const a0 = (i * 2 * Math.PI) / N, a1 = ((i + .5) * 2 * Math.PI) / N, a2 = ((i + 1) * 2 * Math.PI) / N;
    teeth += 'M' + pt(R, a0) + ' L' + pt(r, a1) + ' L' + pt(R, a2) + ' Z';
  }
  let star = '';
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    star += 'M0,0 L' + pt(4.3, a) + ' ';
  }
  /* the ace is struck bigger and threaded on a ribbon */
  const ribbon = big
    ? '<path fill="' + P.red + '" d="M-9,-2.6 C-14.6,-4.6 -17.4,-2.6 -18,1.6 ' +
      'C-14.4,.4 -11.6,1 -9,3 Z"/>' +
      '<path fill="' + P.red + '" d="M9,-2.6 C14.6,-4.6 17.4,-2.6 18,1.6 ' +
      'C14.4,.4 11.6,1 9,3 Z"/>' : '';
  return '<g stroke="' + P.ink + '" stroke-width="1.05">' + ribbon +
    '<circle r="10" fill="' + P.gold + '"/>' +
    '<path d="' + teeth + '" fill="' + P.deep + '" stroke="none"/>' +
    '<circle r="5.5" fill="' + P.gold + '" stroke-width=".8"/>' +
    '<path d="' + star + '" fill="none" stroke="' + P.deep + '" stroke-width="1.5" stroke-linecap="round"/>' +
    '</g>';
}

/* --------------------------------------------------------------------------
   copas -- built like a little drum: a red lid, a hatched gold barrel, a
   blue petalled foot and a red plinth.
   -------------------------------------------------------------------------- */
function cup(P) {
  return '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    '<path fill="' + P.red + '" d="M-8.2,-8 C-8.2,-11.8 8.2,-11.8 8.2,-8 L8.2,-6.2 ' +
    'C8.2,-3.4 -8.2,-3.4 -8.2,-6.2 Z"/>' +
    rep(6, i => shade(P, 'M' + (-6.4 + i * 2.2) + ',-10.6 L' + (-7.6 + i * 2.2) + ',-4.8')) +
    '<path fill="' + P.gold + '" d="M-8.2,-6.2 C-8.2,-3.4 8.2,-3.4 8.2,-6.2 L7.4,1.6 ' +
    'C7.4,3.9 -7.4,3.9 -7.4,1.6 Z"/>' +
    rep(6, i => shade(P, 'M' + (-6.6 + i * 2.3) + ',-4.4 L' + (-8 + i * 2.3) + ',2.6')) +
    '<path fill="' + P.blue + '" d="M-6.8,2.4 C-6.8,7.2 -3.7,9.4 0,9.4 C3.7,9.4 6.8,7.2 6.8,2.4 Z"/>' +
    '<path fill="none" stroke-width=".85" d="M-3.4,3 C-3.7,6.2 -2.7,8.4 -1.2,9.2 ' +
    'M3.4,3 C3.7,6.2 2.7,8.4 1.2,9.2 M0,3 L0,9.4"/>' +
    '<rect x="-8.6" y="9.2" width="17.2" height="3.4" rx=".7" fill="' + P.red + '"/>' +
    '</g>';
}

/* A sword is drawn tall and a coin round, so left alone the sword would
   tower over it. Each suit gets a factor that brings them to the same weight
   on the card. */
const SUIT_SCALE = { b: 1, e: .82, o: 1.2, c: 1.06 };

/* one pip. i alternates the colour of the batons and flips the swords, the
   way the printed card alternates them down the face. */
function pipArt(suit, P, i, big) {
  if (suit === 'o') return coin(P, big);
  if (suit === 'c') return cup(P);
  if (suit === 'e') return sword(P, !big && i % 2 === 1);
  return baton(P, !big && i % 2 === 1, big);
}

/* --------------------------------------------------------------------------
   the court -- the page, the horseman and the king, in the three colours a
   Spanish deck is printed in, standing on their strip of gold ground.
   -------------------------------------------------------------------------- */
function head(P, y, hairW) {
  return '<path fill="' + P.blue + '" d="M' + (-hairW) + ',' + (y - 3.2) + ' C' + (-hairW) + ',' +
    (y + 4.6) + ' ' + (-hairW + 1.4) + ',' + (y + 6.6) + ' 0,' + (y + 6.6) + ' C' +
    (hairW - 1.4) + ',' + (y + 6.6) + ' ' + hairW + ',' + (y + 4.6) + ' ' + hairW + ',' +
    (y - 3.2) + ' Z"/>' +
    '<ellipse cx="0" cy="' + (y + 1.6) + '" rx="4.3" ry="5" fill="' + P.face + '"/>' +
    '<circle cx="-1.7" cy="' + (y + .8) + '" r=".55" fill="' + P.ink + '" stroke="none"/>' +
    '<circle cx="1.7" cy="' + (y + .8) + '" r=".55" fill="' + P.ink + '" stroke="none"/>' +
    '<path fill="none" stroke-width=".7" d="M-1.6,' + (y + 4.4) + ' Q0,' + (y + 5.4) + ' 1.6,' + (y + 4.4) + '"/>';
}

function sota(P) {
  return '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    '<rect x="-18" y="21.5" width="36" height="3" fill="' + P.gold + '"/>' +
    '<path fill="' + P.blue + '" d="M-7.4,6 L-10,21.5 L-4,21.5 L-1.8,7 Z"/>' +
    '<path fill="' + P.blue + '" d="M2.2,7 L4.6,21.5 L10.6,21.5 L8.2,6 Z"/>' +
    '<path fill="' + P.red + '" d="M-9.2,-2.6 C-11.4,3.4 -10.2,7.4 -8,7.8 L8,7.8 ' +
    'C10.2,7.4 11.4,3.4 9.2,-2.6 Z"/>' +
    rep(6, i => shade(P, 'M' + (-7.6 + i * 2.6) + ',-2 L' + (-8.4 + i * 2.8) + ',7.2')) +
    '<rect x="-9.8" y="-5" width="19.6" height="3.2" fill="' + P.gold + '"/>' +
    '<path fill="' + P.red + '" d="M-8.4,-19.4 L8.4,-19.4 L9.8,-5 L-9.8,-5 Z"/>' +
    rep(6, i => shade(P, 'M' + (-6.7 + i * 2.4) + ',-18.4 L' + (-7.2 + i * 2.5) + ',-5.6')) +
    '<path fill="' + P.blue + '" d="M-8.4,-18.4 C-14.2,-17.2 -16.4,-12 -14.8,-6 ' +
    'C-13.8,-2.4 -10,-2.6 -9.4,-5.6 Z"/>' +
    '<path fill="' + P.blue + '" d="M8.4,-18.4 C14.2,-17.2 16.4,-12 14.8,-6 ' +
    'C13.8,-2.4 10,-2.6 9.4,-5.6 Z"/>' +
    '<path fill="' + P.gold + '" d="M-9.6,-19.8 C-13.4,-19.2 -14,-15.4 -12.8,-13.2 L-8.6,-14.8 Z"/>' +
    '<path fill="' + P.gold + '" d="M9.6,-19.8 C13.4,-19.2 14,-15.4 12.8,-13.2 L8.6,-14.8 Z"/>' +
    '<path fill="' + P.gold + '" d="M-5.8,-21 L5.8,-21 L4.6,-18.8 L-4.6,-18.8 Z"/>' +
    head(P, -27.6, 6.4) +
    '<path fill="' + P.red + '" d="M-7.6,-30 C-7.6,-34.6 7.6,-34.6 7.6,-30 C7.6,-28 -7.6,-28 -7.6,-30 Z"/>' +
    '<path fill="' + P.blue + '" d="M-6.8,-28.2 C-6.8,-30 6.8,-30 6.8,-28.2 C6.8,-26.7 -6.8,-26.7 -6.8,-28.2 Z"/>' +
    '</g>';
}

function caballo(P) {
  return '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    '<rect x="-18" y="21.5" width="36" height="3" fill="' + P.gold + '"/>' +
    /* the far legs first, so the near ones sit over them */
    '<path fill="' + P.blue + '" d="M-9.6,7 L-13.4,21.5 L-10,21.5 L-6.6,8 Z"/>' +
    '<path fill="' + P.blue + '" d="M8.6,7 L11.6,21.5 L15,21.5 L11.8,8 Z"/>' +
    /* the horse */
    '<path fill="' + P.blue + '" d="M-13.4,1.4 C-13.4,-5.4 -8.6,-8.4 -1,-8.4 ' +
    'C6.8,-8.4 12.4,-5.6 13,1.4 C13.6,6.6 9.4,9.4 -.4,9.4 C-9.8,9.4 -13.4,6.6 -13.4,1.4 Z"/>' +
    rep(5, i => shade(P, 'M' + (-8 + i * 4) + ',-7 L' + (-9.4 + i * 4) + ',8')) +
    '<path fill="' + P.blue + '" d="M6.6,-6.4 C9,-12 12.2,-16.6 15.4,-20 L18.6,-21.6 ' +
    'L18.2,-17.4 C15.4,-14 13,-9.6 12,-5 Z"/>' +
    '<path fill="' + P.blue + '" d="M15.4,-20 L20.4,-23 L21.6,-20 L17.8,-18 Z"/>' +
    '<circle cx="17.4" cy="-19.4" r=".7" fill="' + P.ink + '" stroke="none"/>' +
    '<path fill="' + P.red + '" d="M13.4,-21.8 L15.6,-25.4 L16.6,-21.2 Z"/>' +
    /* tail, and the near legs */
    '<path fill="' + P.blue + '" d="M-13,-2.6 C-17.6,-3.6 -19.4,1.4 -17.8,7.4 ' +
    'L-15.2,6.6 C-16,2.4 -15,-.4 -12.6,.8 Z"/>' +
    '<path fill="' + P.blue + '" d="M-11.6,7.6 L-15.6,21.5 L-11.6,21.5 L-8.2,8.6 Z"/>' +
    '<path fill="' + P.blue + '" d="M9.6,7.6 L13,21.5 L17,21.5 L13.4,8.6 Z"/>' +
    /* the saddle cloth */
    '<path fill="' + P.red + '" d="M-8.6,-6.6 C-9.8,-1.4 -9.4,3.4 -7.4,6.6 L2.2,6.6 ' +
    'C1.4,1.6 1.6,-3 3,-7 Z"/>' +
    '<path fill="' + P.gold + '" d="M-9.2,5 L2.4,5 L2.2,7.4 L-7.6,7.4 Z"/>' +
    /* the rider */
    '<path fill="' + P.red + '" d="M-6.6,-8.6 C-8.6,-4.6 -8.2,-1.6 -6.6,-.6 ' +
    'L-1,-2 C-2,-5 -2,-7.4 -1.2,-9.4 Z"/>' +
    '<path fill="' + P.red + '" d="M-7.4,-21.6 L1.2,-22.6 L2.6,-9 L-6.6,-8 Z"/>' +
    rep(4, i => shade(P, 'M' + (-5.8 + i * 2.1) + ',-20.8 L' + (-5.2 + i * 2.1) + ',-8.8')) +
    '<path fill="' + P.blue + '" d="M1.2,-21.4 C5.6,-19.6 7.6,-15.4 6.8,-11.2 ' +
    'C6.2,-8.4 3.4,-8.6 3,-11 Z"/>' +
    '<path fill="' + P.gold + '" d="M-4.6,-23 L2.4,-23.6 L2.2,-21.2 L-4.4,-20.6 Z"/>' +
    '<g transform="translate(-2.6,-2)">' + head(P, -27.8, 6) + '</g>' +
    '<path fill="' + P.red + '" d="M-10,-31.4 C-10,-36 5,-36.8 5.2,-32.2 ' +
    'C5.4,-30.2 -9.8,-29.4 -10,-31.4 Z"/>' +
    '<path fill="' + P.gold + '" d="M4,-33.4 C7.4,-36.4 9.4,-35.4 8,-32.6 ' +
    'C6.8,-30.2 5,-30.4 4.4,-31.6 Z"/>' +
    '</g>';
}

function rey(P) {
  return '<g stroke="' + P.ink + '" stroke-width="1.05" stroke-linejoin="round">' +
    '<rect x="-18" y="21.5" width="36" height="3" fill="' + P.gold + '"/>' +
    /* the robe, wide at the hem the way a king's is drawn */
    '<path fill="' + P.red + '" d="M-8.6,-16 L8.6,-16 C13.6,-4 15.6,8 15.6,21.5 ' +
    'L-15.6,21.5 C-15.6,8 -13.6,-4 -8.6,-16 Z"/>' +
    rep(7, i => shade(P, 'M' + (-7.4 + i * 2.5) + ',-14 L' + (-12.6 + i * 4.2) + ',20.5')) +
    /* the gold panel down the front, and the blue lining of the sleeves */
    '<path fill="' + P.gold + '" d="M-3.6,-15 L3.6,-15 C4.6,-2 5.4,9 5.4,21.5 ' +
    'L-5.4,21.5 C-5.4,9 -4.6,-2 -3.6,-15 Z"/>' +
    rep(4, i => shade(P, 'M' + (-3 + i * 2) + ',-13 L' + (-4 + i * 2.7) + ',20.5')) +
    '<path fill="' + P.blue + '" d="M-8.6,-15.6 C-14,-13.6 -16.4,-8 -15,-1.6 ' +
    'C-14.2,2 -10.4,1.6 -10.2,-1.4 Z"/>' +
    '<path fill="' + P.blue + '" d="M8.6,-15.6 C14,-13.6 16.4,-8 15,-1.6 ' +
    'C14.2,2 10.4,1.6 10.2,-1.4 Z"/>' +
    /* collar */
    '<path fill="' + P.gold + '" d="M-7,-18 L7,-18 L8.6,-15 L-8.6,-15 Z"/>' +
    head(P, -25.6, 6.6) +
    /* the crown: three points, a ball on each, on a banded circlet */
    '<path fill="' + P.gold + '" d="M-8.4,-27.4 L-8.4,-33.6 L-4.6,-29.6 L0,-35.4 ' +
    'L4.6,-29.6 L8.4,-33.6 L8.4,-27.4 Z"/>' +
    '<circle cx="-8.4" cy="-34.8" r="1.5" fill="' + P.gold + '"/>' +
    '<circle cx="0" cy="-36.6" r="1.7" fill="' + P.gold + '"/>' +
    '<circle cx="8.4" cy="-34.8" r="1.5" fill="' + P.gold + '"/>' +
    '<rect x="-8.8" y="-27.6" width="17.6" height="2.8" rx=".8" fill="' + P.gold + '"/>' +
    '</g>';
}

function figure(rank, P) {
  return rank === 10 ? sota(P) : rank === 11 ? caballo(P) : rey(P);
}

/* the pip layouts, on a 100 x 150 card */
const PIPS = {
  1: [[50, 75]],
  2: [[50, 44], [50, 106]],
  3: [[50, 38], [50, 75], [50, 112]],
  4: [[32, 46], [68, 46], [32, 104], [68, 104]],
  5: [[32, 44], [68, 44], [50, 75], [32, 106], [68, 106]],
  6: [[32, 39], [68, 39], [32, 75], [68, 75], [32, 111], [68, 111]],
  7: [[32, 38], [68, 38], [26, 75], [50, 75], [74, 75], [32, 112], [68, 112]]
};
const PIP_SCALE = { 1: 2.4, 2: 1.5, 3: 1.22, 4: 1.3, 5: 1.15, 6: 1.1, 7: .98 };

function cardSVG(card, t) {
  const P = t || D();
  const g = P.glow ? ' filter="url(#cgGlow)"' : '';
  let out = '<svg class="cf" viewBox="0 0 100 150" preserveAspectRatio="none">' +
    '<rect x="0" y="0" width="100" height="150" rx="7" fill="' + P.card + '"/>';

  /* the frame, with the suit's pintas cut out of it */
  out += '<rect x="5.5" y="5.5" width="89" height="139" fill="none" stroke="' + P.frame + '" stroke-width="1.3"/>';
  const n = PINTAS[card.suit];
  for (let i = 0; i < n; i++) {
    const f = (i + 1) / (n + 1);
    out += '<rect x="' + (5.5 + 89 * f - 5) + '" y="3.8" width="10" height="3.4" fill="' + P.card + '"/>';
    out += '<rect x="' + (5.5 + 89 * f - 5) + '" y="143.3" width="10" height="3.4" fill="' + P.card + '"/>';
  }

  /* the middle */
  const sc = SUIT_SCALE[card.suit] || 1;
  if (card.rank >= 10) {
    /* the figure fills the card and holds its suit, the way it is printed */
    out += '<g' + g + ' transform="translate(55,79) scale(1.58)">' + figure(card.rank, P) + '</g>';
    out += '<g' + g + ' transform="translate(20,66) scale(' + (1.02 * sc).toFixed(3) + ')">' +
      pipArt(card.suit, P, 0, false) + '</g>';
  } else if (card.rank === 1) {
    out += '<g' + g + ' transform="translate(50,75) scale(' + (2.4 * sc).toFixed(3) + ')">' +
      pipArt(card.suit, P, 0, true) + '</g>';
  } else {
    const scale = ((PIP_SCALE[card.rank] || 1) * sc).toFixed(3);
    out += '<g' + g + '>' + (PIPS[card.rank] || []).map(([x, y], i) => {
      /* on the printed card the batons fan out from the middle of the face */
      const lean = card.suit === 'b' ? (x < 45 ? 15 : x > 55 ? -15 : 0) : 0;
      return '<g transform="translate(' + x + ',' + y + ') rotate(' + lean + ') scale(' + scale + ')">' +
        pipArt(card.suit, P, i, false) + '</g>';
    }).join('') + '</g>';
  }

  /* the rank in two corners, the way you read a fanned hand */
  const lbl = String(card.rank);
  out += '<text x="14.5" y="23" font-size="14.5" fill="' + P.ink + '" text-anchor="middle" font-weight="800" font-family="Georgia,serif">' + lbl + '</text>';
  out += '<text x="85.5" y="127" font-size="14.5" fill="' + P.ink + '" text-anchor="middle" font-weight="800" font-family="Georgia,serif" ' +

/* the line under the table */
/* Every sentence the table says goes through here on its way to the screen.
   In English it is a no-op; in French or Arabic shared/lang.js matches the
   whole sentence -- names and numbers included -- and hands back the other
   language. Doing it at the source rather than in the DOM matters because
   these sentences carry markup, and a DOM walker would only ever see the
   pieces between the tags. */
const T = s => (window.CGLang ? window.CGLang.t(s) : s);

function say(html) {
  const box = $('#saying');
  box.innerHTML = '';
  if (html) box.appendChild(el('div', null, html));
}
const cName = c => '<u>' + c.rank + ' ' + T(SUIT_NAME[c.suit].toLowerCase()) + '</u>';
const rList = cs => cs.map(c => c.rank).join(', ');

/* Turn the events of one move into a sentence somebody can follow. */
function narrate(evs, v) {
  const cap = evs.find(e => e.t === 'capture');
  const drop = evs.find(e => e.t === 'drop');
  const bits = [];
  if (cap) {
    const who = nameOf(cap.who);
    if (cap.taken.length === 1) bits.push(T('<b>' + esc(who) + '</b> played the ' + cName(cap.card) + ' and took the matching ' + cap.taken[0].rank + '.'));
    else bits.push(T('<b>' + esc(who) + '</b> played the ' + cName(cap.card) + ' and swept <i>' + rList(cap.taken) + '</i> — the run climbs while the next rank is there.'));
  } else if (drop) {
    const who = nameOf(drop.who);
    bits.push(T('<b>' + esc(who) + '</b> had nothing to match, so the ' + cName(drop.card) + ' stays on the table.'));
  }
  evs.forEach(e => {
    switch (e.t) {
      case 'darba': bits.push(T('<i>Darba</i> — taken straight back off the player before' + (e.points ? ', +' + e.points : '') + '.')); break;
      case 'khamsa': bits.push(T("<i>B'khamsa</i> — the third of that rank, right after the darba. +" + e.points + ' to ' + esc(nameOf(e.who)) + '.')); break;
      case 'ashra': bits.push(T("<i>B'ashra</i> — and the fourth. +" + e.points + ' to ' + esc(nameOf(e.who)) + '.')); break;
      case 'chainBroken': bits.push(T('The chain on the ' + e.rank + 's is broken.')); break;
      case 'missa': bits.push(T(e.points ? '<i>Missa</i> — the table is clear, +' + e.points + '.' : 'Table clear, but no missa on the last hand.')); break;
      case 'caught': bits.push(T('<b>' + esc(nameOf(e.who)) + '</b> was sitting on a ronda of ' + e.rank + 's — a point to everybody else.')); break;
      case 'called': bits.push(T('<b>' + esc(nameOf(e.who)) + '</b> calls ' + (e.kind === 'tringa' ? 'TRINGA' : 'RONDA') + ' on the ' + e.rank + 's.')); break;
      case 'hidden': bits.push(T('<b>' + esc(nameOf(e.who)) + '</b> says nothing.')); break;
      case 'call': if (e.points) bits.push(T('+' + e.points + ' to ' + esc(nameOf(e.who)) + ' for the ' + (e.kind === 'tringa' ? 'tringa' : 'ronda') + '.')); break;
      case 'qaa': bits.push(T(e.kind === 'rey'
        ? "<i>Qa'at Rey</i> — the king was on the bottom of the deck. +" + e.points + ' to the dealer.'
        : "<i>Qa'at As</i> — the ace was on the bottom. +" + e.points + ' against the dealer.')); break;
      case 'lastDeal': bits.push(T('<b>Last three each</b> — the deck is finished after this.')); break;
      case 'bawesh': bits.push(T('<i>Bawesh</i> — ' + esc(nameOf(e.who)) + ' sweeps the last ' + e.cards.length + '.')); break;
      case 'bury': bits.push(T('The ' + cName(e.card) + ' went back in — the table has to start with no pair and no run.')); break;
    }
  });
  if (!bits.length) return;
  say(bits.join(' '));
}

/* --------------------------------------------------------------------------
   Playing a card, drawn the way it happens at the table.

   Two beats. First the card leaves the hand and lands ON the cards it is
   about to take, which is the moment that makes a capture make sense -- you
   see the seven come down on the seven. Then, after a breath, the whole
   little stack is swept off to whoever took it.

   Everything is measured off the DOM as it stands BEFORE the new state is
   drawn, so the played card starts from the hand it really came from and the
   captured cards start from where they really were.
   -------------------------------------------------------------------------- */

/* where a player's captured cards live on screen */
function pileTarget(whoId) {
  if (whoId === ME) return $('#myPile');
  const seat = document.querySelector('#felt .rSeat[data-pid="' + whoId + '"]');
  return (seat && seat.querySelector('.pileNum')) || seat || $('#mesa');
}

/* where a played card comes from: my own hand, or the other player's backs */
function playSource(whoId, card) {
  if (whoId === ME) {
    const inHand = document.querySelector('#myHand .rcard[data-cid="' + card.id + '"]');
    if (inHand) return inHand;
  }
  const seat = document.querySelector('#felt .rSeat[data-pid="' + whoId + '"]');
  if (seat) return seat.querySelector('.backs i:last-child') || seat;
  return $('#myPile');
}

function centreOf(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
}

/* a loose card floating over the page, sized like a table card */
function flyer(html, at, w, h, cls) {
  const f = el('div', 'flyC' + (cls ? ' ' + cls : ''));
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.style.left = (at.x - w / 2) + 'px'; f.style.top = (at.y - h / 2) + 'px';
  f.innerHTML = html;
  document.body.appendChild(f);
  return f;
}

/* A card thrown from A to B, arcing rather than sliding: real cards do not
   travel in straight lines and a straight line reads as a slideshow. */
function arc(node, dx, dy, opt) {
  opt = opt || {};
  const lift = opt.lift === undefined ? -Math.min(52, 18 + Math.abs(dx) * .09) : opt.lift;
  const s0 = opt.from === undefined ? 1 : opt.from;
  const s1 = opt.to === undefined ? 1 : opt.to;
  const r0 = opt.spin === undefined ? 0 : opt.spin;
  const anim = node.animate([
    { transform: 'translate(0,0) scale(' + s0 + ') rotate(' + r0 + 'deg)', opacity: 1, offset: 0 },
    {
      transform: 'translate(' + (dx * .5) + 'px,' + (dy * .5 + lift) + 'px) scale(' +
        ((s0 + s1) / 2 * 1.06) + ') rotate(' + (r0 * .35) + 'deg)',
      opacity: opt.fade ? .8 : 1, offset: .55
    },
    {
      transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s1 + ') rotate(' + (opt.land || 0) + 'deg)',
      opacity: opt.fade ? .12 : 1, offset: 1
    }
  ], { duration: opt.ms || 340, easing: 'cubic-bezier(.32,.62,.35,1)', fill: 'forwards' });
  return anim;
}

/* --------------------------------------------------------------------------
   Playing a card.

   Two beats. The card leaves the hand -- and leaves it visibly, the real one
   disappears the instant the flying one appears, or you watch your own card
   in two places at once -- and lands ON the cards it is about to take. Then,
   after a breath, the whole little stack is swept off to whoever took it.

   Everything is measured off the DOM as it stands BEFORE the new state is
   drawn, so the card starts from the hand it really came from and the
   captured cards start from where they really lay.
   -------------------------------------------------------------------------- */
function flyPlay(whoId, card, taken) {
  const mesa = $('#mesa');
  if (!mesa || !card) return 0;
  taken = taken || [];

  const doomed = taken
    .map(c => ({ c, el: mesa.querySelector('.rcard[data-cid="' + c.id + '"]') }))
    .filter(x => x.el);

  const src = playSource(whoId, card);
  const from = centreOf(src);
  const sample = mesa.querySelector('.rcard') || src;
  const size = sample.getBoundingClientRect();
  const w = size.width || 58, h = size.height || 87;

  /* the card is in the air now, so it is not in the hand any more */
  src.classList.add('inflight');

  /* the landing spot: on top of what it takes, or the middle of an empty table */
  let land;
  if (doomed.length) {
    const cs = doomed.map(d => centreOf(d.el));
    land = { x: cs.reduce((a, p) => a + p.x, 0) / cs.length, y: cs.reduce((a, p) => a + p.y, 0) / cs.length };
  } else {
    const m = centreOf(mesa);
    land = { x: m.x, y: m.y };
  }

  const LAND = 380, HOLD = doomed.length ? 300 : 160, SWEEP = 440, STAG = 60;
  const startScale = from.w ? Math.min(1.25, Math.max(.5, from.w / w)) : 1;

  /* --- beat one: the card comes down --- */
  const played = flyer(cardSVG(card), from, w, h);
  arc(played, land.x - from.x, land.y - from.y, {
    ms: LAND, from: startScale, to: 1,
    spin: whoId === ME ? -7 : 9, land: -2.5
  });

  setTimeout(() => {
    if (doomed.length) SFX.play(); else SFX.draw();
    /* the cards underneath take the weight of it */
    doomed.forEach(d => { d.el.classList.add('doomed'); d.el.classList.add('pressed'); });
    setTimeout(() => doomed.forEach(d => d.el.classList.remove('pressed')), 160);
  }, LAND - 60);

  if (!doomed.length) {
    setTimeout(() => played.remove(), LAND + HOLD + 90);
    return LAND + HOLD;
  }

  /* --- beat two: the whole stack is swept away --- */
  const target = pileTarget(whoId);
  setTimeout(() => {
    SFX.draw();
    const to = centreOf(target);
    const send = (node, i, at) => {
      arc(node, to.x - at.x, to.y - at.y, {
        ms: SWEEP, to: .32, land: ((i * 41) % 30) - 15, fade: true, lift: -18
      });
      setTimeout(() => node.remove(), SWEEP + 140);
    };
    doomed.forEach((d, i) => {
      const p = centreOf(d.el);
      const node = flyer(cardSVG(d.c), p, w, h);
      d.el.classList.add('taking');
      setTimeout(() => send(node, i, p), i * STAG);
    });
    /* and the card that took them goes last, off the top of the pile */
    setTimeout(() => send(played, doomed.length, land), doomed.length * STAG);
  }, LAND + HOLD);

  setTimeout(() => {
    const t = pileTarget(whoId);
    if (!t) return;
    t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
  }, LAND + HOLD + SWEEP * .7);

  return LAND + HOLD + SWEEP + doomed.length * STAG;
}

/* --------------------------------------------------------------------------
   Dealing.

   Run AFTER the redraw, because it animates the cards that are now on screen
   rather than throwing copies of them about: each one starts life over the
   deck and flies to where it belongs, a few milliseconds behind the last.
   That way the hand you end up with is exactly the hand you watched arrive.
   -------------------------------------------------------------------------- */
function dealSweep(opening) {
  const deck = $('#deckPile');
  if (!deck) return 0;
  const d = centreOf(deck);
  const list = [];
  /* the four on the table go down first, then round the table hand by hand */
  if (opening) $('#mesa').querySelectorAll('.rcard').forEach(c => list.push(c));
  document.querySelectorAll('#felt .rSeat').forEach(seat => {
    seat.querySelectorAll('.backs i').forEach(c => list.push(c));
  });
  $('#myHand').querySelectorAll('.rcard').forEach(c => list.push(c));
  if (!list.length) return 0;

  const STAG = 42, RUN = 420;
  SFX.shuffle();
  list.forEach(function (c, i) {
    const r = c.getBoundingClientRect();
    if (!r.width) return;
    c.style.setProperty('--dx', (d.x - (r.left + r.width / 2)).toFixed(1) + 'px');
    c.style.setProperty('--dy', (d.y - (r.top + r.height / 2)).toFixed(1) + 'px');
    c.style.animationDelay = (i * STAG) + 'ms';
    c.classList.remove('dealIn'); void c.offsetWidth; c.classList.add('dealIn');
    setTimeout(function () { c.classList.remove('dealIn'); c.style.animationDelay = ''; }, RUN + i * STAG + 60);
  });
  return RUN + list.length * STAG;
}

/* ==========================================================================
   playing
   ========================================================================== */
function play(cardId) { send({ type: 'play', cardId }); }
function send(move) {
  if (!G || animating) return;
  if (busy && !NET) return;
  preview([]);
  if (NET) { netSend({ t: 'move', move }); return; }
  try {
    const r = applyMove(G, ME, move);
    G = r.state;
    after(r.events);
  } catch (e) { SFX.bad(); logLine('⚠ ' + e.message); }
}

function after(rawEvents) {
  /* the same filter the server applies online: what a bot chose to keep quiet
     about is not yours to see just because the game is running on your machine */
  const events = eventsFor(rawEvents, ME);
  /* every play is drawn: a capture lands on what it takes, a plain card just
     goes down on the table */
  const move = events.find(e => e.t === 'capture' || e.t === 'drop');
  showEvents(events);
  narrate(events, myView());

  const dealt = events.some(e => e.t === 'deal');
  /* the redraw has to happen with animating already false, or the cards come
     back without their click handlers and the hand goes dead */
  const finish = () => {
    animating = false;
    render();
    if (G.phase === 'roundEnd' || G.phase === 'gameEnd') return showRoundEnd();
    if (!busy) tickBots();
  };
  const done = () => {
    if (!dealt) return finish();
    /* the new cards fly out of the deck, and nobody moves until they land */
    render();
    setTimeout(finish, dealSweep(false) || 0);
  };

  animating = true;
  /* the card comes down, the pile is swept, and then everybody gets a beat to
     read what just happened before the next one goes */
  const flight = move ? flyPlay(move.who, move.card, move.taken) : 0;
  setTimeout(done, Math.max(flight, 240) + Math.round(paceMs() * (move && move.taken ? .55 : .8)));
}

function tickBots() {
  if (NET || !G) return;
  if (G.phase !== 'playing' && G.phase !== 'calling') return;
  const who = G.order[G.turn];
  if (who === ME) { render(); return; }
  busy = true;
  setTimeout(() => {
    if (!G || (G.phase !== 'playing' && G.phase !== 'calling')) { busy = false; return; }
    const m = botMove(G, who, Math.random, cfg.skill);
    if (!m) { busy = false; return; }
    let r;
    try { r = applyMove(G, who, m); } catch (e) { busy = false; return; }
    G = r.state; busy = false;
    after(r.events);
  }, Math.max(speedMs(), paceMs() * 0.4));
}

/* ==========================================================================
   what just happened
   ========================================================================== */
function nameOf(id) { const p = (G.players || []).find(x => x.id === id); return p ? p.name : '?'; }
/* four play as two pairs, so 'A' and 'B' mean something; on your own the team
   letter is just you, and your name reads better */
function teamName(t) {
  const v = myView() || {};
  const mem = (v.players || []).filter(p => p.team === t);
  return mem.length === 1 ? mem[0].name : t;
}
function logLine(t) {
  const l = $('#log');
  l.insertBefore(el('div', null, T(t)), l.firstChild);
  while (l.children.length > (innerWidth < 700 ? 3 : 6)) l.removeChild(l.lastChild);
}
function callOut(word, sub) {
  word = T(word); sub = sub ? T(sub) : sub;
  /* the last events of a round arrive with the round-end card, and a shout
     landing on top of it just makes both unreadable */
  if ($('#roundOvl').classList.contains('show')) return;
  const d = el('div', 'callOut', '<b>' + esc(word) + '</b><span>' + esc(sub || '') + '</span>');
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1600);
}
const clearCallOuts = () => document.querySelectorAll('.callOut').forEach(e => e.remove());

function showEvents(evs) {
  (evs || []).forEach(e => {
    switch (e.t) {
      case 'deal':
        SFX.shuffle();
        logLine('🂠 three each — ' + e.left + ' left in the deck');
        break;
      case 'bury':
        logLine('↩️ ' + cardName(e.card) + ' buried, the table has to start dead');
        break;
      case 'call': {
        const label = e.kind === 'tringa' ? 'TRINGA' : 'RONDA';
        if (e.points > 0) {
          SFX.uno();
          callOut(label, nameOf(e.who) + ' · ' + e.rank + 's · +' + e.points);
          burst(innerWidth / 2, innerHeight * .38, 30, ['#ffc93c', '#fff']);
          logLine('📣 ' + nameOf(e.who) + ' calls ' + label + ' on the ' + e.rank + 's — ' + e.points);
        } else {
          logLine('📣 ' + nameOf(e.who) + ' calls ' + label + ' on the ' + e.rank + 's — beaten');
        }
        break;
      }
      /* the sound for these two belongs to the animation, not to the log --
         it goes off when the card actually lands, not when the news arrives */
      case 'capture':
        logLine('✋ ' + nameOf(e.who) + ' plays the ' + e.card.rank + ' and takes ' +
          e.taken.map(c => c.rank).join(', ') + (e.run ? ' — a run' : ''));
        break;
      case 'drop':
        logLine('🃏 ' + nameOf(e.who) + ' leaves the ' + e.card.rank);
        break;
      case 'darba':
        SFX.hit();
        callOut('DARBA', nameOf(e.who) + (e.points ? ' · +' + e.points : ''));
        logLine('👊 DARBA — ' + nameOf(e.who) + ' takes the ' + e.rank + ' straight back' + (e.points ? ' (+' + e.points + ')' : ''));
        break;
      case 'khamsa':
        SFX.win();
        callOut("B'KHAMSA", nameOf(e.who) + ' · +' + e.points);
        burst(innerWidth / 2, innerHeight * .4, 40, ['#ffc93c', '#ff8a2b']);
        logLine("🔥 B'KHAMSA — the third " + e.rank + ' (+' + e.points + ')');
        break;
      case 'ashra':
        SFX.win();
        callOut("B'ASHRA", nameOf(e.who) + ' · +' + e.points);
        for (let i = 0; i < 4; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .4, 40), i * 130);
        logLine("💥 B'ASHRA — all four " + e.rank + 's (+' + e.points + ')');
        break;
      case 'chainBroken': logLine('🔗 the chain on the ' + e.rank + ' is broken'); break;
      case 'called':
        SFX.uno();
        callOut(e.kind === 'tringa' ? 'TRINGA' : 'RONDA', nameOf(e.who) + ' · ' + e.rank + 's');
        break;
      case 'hidden': logLine('🤐 ' + nameOf(e.who) + ' says nothing'); break;
      case 'caught':
        SFX.hit();
        callOut('CAUGHT', nameOf(e.who) + ' sat on a ronda');
        logLine('👀 ' + nameOf(e.who) + ' was sitting on a ronda of ' + e.rank + 's — a point to everybody else');
        break;
      case 'qaa':
        SFX.win();
        callOut(e.kind === 'rey' ? "QA'AT REY" : "QA'AT AS", '+' + e.points);
        for (let i = 0; i < 3; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .4, 34), i * 130);
        logLine('👑 ' + (e.kind === 'rey' ? 'the king' : 'the ace') + ' was on the bottom — +' + e.points);
        break;
      case 'lastDeal': SFX.rev(); logLine('⚠️ last three each — the deck is finished after this'); break;
      case 'callTime': break;
      case 'missa':
        if (e.points) { SFX.uno(); callOut('MISSA', nameOf(e.who) + ' · +' + e.points); logLine('🧹 MISSA — ' + nameOf(e.who) + ' clears the table (+' + e.points + ')'); }
        else logLine('🧹 table cleared — no missa on the last hand');
        break;
      case 'bawesh':
        SFX.rev();
        logLine('🧺 BAWESH — ' + nameOf(e.who) + ' sweeps the last ' + e.cards.length);
        break;
      case 'count':
        /* three at the table means three teams, not two */
        logLine('🔢 ' + Object.keys(e.counts).map(t =>
          teamName(t) + ' ' + e.counts[t] + ' cards (+' + (e.gained[t] || 0) + ')').join(' · '));
        break;
    }
  });
}

/* ---------------- the end of a round ---------------- */
/* --------------------------------------------------------------------------
   The night's scoreboard.

   A game against bots is practice and never counts. An online game counts if
   the host said so when the room was made -- the result goes into a tray in
   this browser, and the scoreboard picks it up the next time it is opened.
   Teams are flattened into a ranking: the winning side first, in the order
   they sat.
   -------------------------------------------------------------------------- */
let booked = false;
function bookResult(v) {
  if (booked || !NET || !window.CGScore) return;
  if (!(NET.lobby && NET.lobby.cfg && NET.lobby.cfg.count)) return;
  const teams = (v.teams && v.teams.length) ? v.teams.slice() : ['A', 'B'];
  const pts = v.teamScores || {};
  /* makla is not scored in points at all, it is counted in cards, so the
     ranking falls back to the piles when the points are level */
  const piles = {};
  teams.forEach(t => { piles[t] = 0; });
  v.players.forEach(p => { piles[p.team] = (piles[p.team] || 0) + (p.pile || 0); });
  const order = teams.sort((a, b) =>
    ((b === v.winner) ? 1 : 0) - ((a === v.winner) ? 1 : 0) ||
    (pts[b] || 0) - (pts[a] || 0) ||
    (piles[b] || 0) - (piles[a] || 0));
  const names = [];
  order.forEach(t => v.players.filter(p => p.team === t).forEach(p => names.push(p.name)));
  if (names.length < 2) return;
  const makla = v.variant === 'makla';
  booked = window.CGScore.push({
    game: 'ronda',
    ranking: names,
    draw: v.winner === null || (makla && piles[order[0]] === piles[order[1]]),
    score: order.map(t => (makla ? piles[t] : (pts[t] || 0))).join('-'),
    room: NET.code || ''
  });
  if (booked) logLine('📒 result saved to the night');
}

function showRoundEnd() {
  clearCallOuts();
  music.tense(false); music.sting();
  const v = myView();
  const gameOver = G.phase === 'gameEnd';
  if (gameOver) bookResult(v);
  for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .4, 40), i * 140);
  const box = $('#roundCard');
  const won = gameOver ? G.winner : G.roundWinner;
  const mine = v.you.team;
  const headline = won === null ? 'A DRAW' : (won === mine ? 'YOU TAKE IT' : 'THEY TAKE IT');
  const label = won === null ? 'LEVEL'
    : (G.players.length === 4 ? 'TEAM ' + won
      : (G.players.find(p => p.team === won) || {}).name || won);
  box.innerHTML =
    '<div style="font-size:52px">' + (won === null ? '🤝' : gameOver ? '🏆' : '🧺') + '</div>' +
    '<div class="bigName">' + esc(label) + '</div>' +
    '<h2>' + (gameOver ? headline : 'TAKES THE ROUND') + '</h2>';

  /* every side, however many there are — a three-hander has three */
  const teams = (G.teams && G.teams.length) ? G.teams : ['A', 'B'];
  const counts = {};
  teams.forEach(t => { counts[t] = 0; });
  G.players.forEach(p => { counts[p.team] = (counts[p.team] || 0) + p.pile.length; });
  const paired = G.players.length === 4;
  const list = el('div', 'scoreList');
  teams.slice().sort((x, y) => counts[y] - counts[x]).forEach(t => {
    const who = G.players.filter(p => p.team === t).map(p => p.name).join(' + ');
    list.appendChild(el('div', null,
      '<span style="width:10px;height:10px;border-radius:3px;background:' + TEAM_COLOR(t) +
      ';display:inline-block"></span>' +
      '<span>' + (paired ? 'TEAM ' + t + ' · ' : '') + esc(who) + '</span>' +
      '<span>' + counts[t] + ' cards' + (v.variant === 'ronda' ? ' · ' + G.teamScores[t] + 'p' : '') + '</span>'));
  });
  box.appendChild(list);
  const share = v.share || 20;
  box.appendChild(el('div', null,
    '<div style="font-size:10px;color:var(--dim);font-weight:700;margin-top:2px">' +
    (v.variant === 'ronda'
      ? 'A point a card over ' + share + ', plus everything called along the way.'
      : share + ' cards is a draw. Anything more wins it.') + '</div>'));

  const b = el('button', 'go', gameOver ? 'PLAY AGAIN' : 'NEXT ROUND ▶');
  if (NET && !NET.isHost) { b.textContent = 'WAITING FOR THE HOST…'; b.style.opacity = '.55'; b.style.cursor = 'default'; }
  else b.onclick = () => {
    $('#roundOvl').classList.remove('show');
    if (NET) { netSend({ t: gameOver ? 'again' : 'next' }); return; }
    if (gameOver) { location.reload(); return; }
    G = nextRound(G);
    logLine('— round ' + G.round + ' —');
    showEvents(eventsFor(G.openingEvents || [], ME));
    narrate(eventsFor(G.openingEvents || [], ME), myView());
    render(); tickBots();
  };
  box.appendChild(b);
  $('#roundOvl').classList.add('show');
}

const seatKey = c => 'cybergrill_ronda_seat_' + c;
const loadSeat = c => { try { return JSON.parse(localStorage.getItem(seatKey(c)) || 'null'); } catch (e) { return null; } };
const saveSeat = (c, s) => { try { localStorage.setItem(seatKey(c), JSON.stringify(s)); } catch (e) { } };

function netConnect(code, name) {
  if (!SERVER) { netMsg('No server is configured for this build yet.'); return; }
  code = code.toUpperCase();
  const seat = loadSeat(code);
  NET = NET || { code, view: null, isHost: false, tries: 0, lobby: null };
  NET.code = code; NET.closing = false;
  pill('', 'CONNECTING…');
  let ws;
  try { ws = new WebSocket(SERVER.replace(/^http/, 'ws') + '/ws/' + code); }
  catch (e) { netMsg('Could not reach the server.'); return; }
  NET.ws = ws;
  ws.onopen = () => {
    NET.tries = 0; pill('live', 'ROOM ' + code);
    const hello = { t: 'hello', name };
    if (seat && seat.id) { hello.playerId = seat.id; hello.token = seat.token; }
    ws.send(JSON.stringify(hello));
  };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handleNet(m); };
  ws.onclose = () => {
    if (!NET || NET.closing) return;
    pill('down', 'RECONNECTING…'); NET.tries++;
    setTimeout(() => { if (NET && !NET.closing) netConnect(code, name); }, Math.min(8000, 500 * Math.pow(1.7, NET.tries)));
  };
  ws.onerror = () => { };
}


/* ==========================================================================
   THE VOICE ROOM
   --------------------------------------------------------------------------
   Talk to the people you are playing against. The audio goes browser to
   browser; the room's WebSocket only carries the introductions. It is only
   offered online, because there is nobody to talk to against bots.
   ========================================================================== */
let voiceOn = false, voiceState = null;

function voiceNames() {
  const L = NET && NET.lobby;
  const map = {};
  ((L && L.players) || []).forEach(p => { map[p.id] = p; });
  return map;
}

function drawVoice() {
  const bar = $('#voiceBar');
  const chip = $('#voiceChip');
  if (!bar || !chip) return;
  const st = voiceState || { on: false, talking: [], peers: [], muted: false, level: 0, error: '' };
  const live = !!NET;
  chip.style.display = live ? '' : 'none';
  chip.classList.toggle('on', st.on);
  chip.querySelector('i').textContent = st.on ? (st.muted ? '🔇' : '🎙') : '🎙';

  bar.classList.toggle('on', st.on || !!st.error);
  if (!st.on && !st.error) { bar.innerHTML = ''; return; }

  const map = voiceNames();
  const inRoom = Object.keys(map).filter(id => map[id].voice && !map[id].bot);
  if (st.on && inRoom.indexOf(ME) === -1) inRoom.unshift(ME);

  bar.innerHTML = '';
  if (st.error) { bar.appendChild(el('div', 'vErr', esc(st.error))); }

  if (st.on) {
    const who = el('div', 'vWho');
    inRoom.forEach(id => {
      const p = map[id] || { name: 'you' };
      const talking = st.talking.indexOf(id) !== -1;
      const mutedHere = id === ME ? st.muted : !!p.muted;
      const d = el('div', 'vP live' + (talking ? ' talk' : '') + (mutedHere ? ' mute' : ''),
        '<span class="vDot"></span><span>' + esc((p.name || '') + (id === ME ? ' (you)' : '')) + '</span>');
      who.appendChild(d);
    });
    if (inRoom.length < 2) who.appendChild(el('div', 'vP', 'WAITING FOR SOMEONE ELSE TO JOIN'));
    bar.appendChild(who);

    const meter = el('div', 'vMeter', '<i style="width:' + Math.round((st.muted ? 0 : st.level) * 100) + '%"></i>');
    bar.appendChild(meter);

    const mute = el('button', st.muted ? 'hot' : '', st.muted ? '🔇 MUTED' : '🎙 MUTE');
    mute.onclick = () => { CGVoice.toggleMute(); SFX.tick(); };
    bar.appendChild(mute);

    const off = el('button', '', 'LEAVE VOICE');
    off.onclick = () => { CGVoice.leave(); SFX.tick(); };
    bar.appendChild(off);
  }

  /* a ring round whoever is talking, on the seat they are sitting in */
  document.querySelectorAll('#felt .rSeat, #seats .seat').forEach(sEl => {
    const id = sEl.dataset.pid;
    sEl.classList.toggle('talking', !!id && st.talking.indexOf(id) !== -1);
  });

  /* and the music steps back while anybody is speaking */
  const talking = st.talking.length > 0;
  if (talking !== voiceOn) { voiceOn = talking; if (music && music.duck) music.duck(talking); }
}

function voiceSetup() {
  if (!window.CGVoice || !NET) return;
  CGVoice.setup({
    self: ME,
    send: m => netSend(m),
    onChange: st => { voiceState = st; drawVoice(); }
  });
}

if ($('#voiceChip')) $('#voiceChip').onclick = () => {
  if (!NET) { logLine('🎙 the voice room is for online games'); return; }
  voiceSetup();
  SFX.tick();
  const st = CGVoice.state();
  if (st.on) CGVoice.leave();
  else CGVoice.join().then(ok => { if (ok) logLine('🎙 you are in the voice room'); });
};

function handleNet(m) {
  if (!NET) return;
  switch (m.t) {
    /* the voice room's introductions, on their way between two browsers */
    case 'rtc':
      if (window.CGVoice) CGVoice.signal(m);
      break;
    case 'error':
      netMsg(m.msg);
      if (!G) pill('down', m.msg.toUpperCase()); else logLine('⚠ ' + m.msg);
      break;
    case 'joined':
      ME = m.you.id; NET.code = m.code; NET.isHost = m.hostId === m.you.id;
      saveSeat(m.code, { id: m.you.id, token: m.you.token });
      netMsg('');
      break;
    case 'lobby':
      /* keep the mesh in step with who is actually in the voice room */
      if (window.CGVoice) {
        CGVoice.roster((m.players || []).filter(p => p.voice && p.id !== ME).map(p => p.id));
        drawVoice();
      }
      NET.lobby = m; NET.isHost = m.hostId === ME;
      if (m.gameId && m.gameId !== 'ronda') netMsg('That room is playing ' + m.gameId + ', not Ronda.');
      if (!m.started) { G = null; showLobby(); } else $('#lobbyOvl').classList.remove('show');
      break;
    case 'state':
      netQ.push(m); pumpNet();
      break;
  }
}

/* One state at a time: while cards are in flight the next update waits, so
   nothing on the table changes underneath a moving card. */
function pumpNet() {
  if (!NET) { netQ = []; return; }
  if (animating || !netQ.length) return;
  applyNetState(netQ.shift());
}

function applyNetState(m) {
  const v = m.v;
  const first = !G;
  const evs = m.events || [];
  NET.view = v;

  /* the previous table is still on screen, so the card can be played onto it
     and the capture lifted off it before the new state replaces both */
  const move = evs.find(e => e.t === 'capture' || e.t === 'drop');
  const flight = (!first && move && move.card) ? flyPlay(move.who, move.card, move.taken) : 0;

  G = {
    order: v.players.map(p => p.id),
    turn: Math.max(0, v.players.findIndex(p => p.id === v.turn)),
    phase: v.phase, variant: v.variant, target: v.target, round: v.round,
    teams: v.teams, teamScores: v.teamScores,
    roundWinner: v.roundWinner, winner: v.winner,
    /* the round-end card counts piles, and online we only have the numbers */
    players: v.players.map(p => ({ id: p.id, name: p.name, team: p.team, pile: { length: p.pile } }))
  };
  if (first) {
    $('#lobbyOvl').classList.remove('show');
    $('#setup').classList.add('gone');
    $('#table').classList.add('live');
    pill('live', 'ROOM ' + NET.code);
    $('#log').innerHTML = '';
    logLine(v.variant === 'makla' ? '\u2615 Makla.' : '\ud83c\udccf Ronda. First to ' + v.target + '.');
  }
  showEvents(evs);
  narrate(evs, v);

  const dealt = evs.some(e => e.t === 'deal');
  const settle = () => {
    animating = false;
    render();
    if (v.phase === 'roundEnd' || v.phase === 'gameEnd') showRoundEnd();
    else $('#roundOvl').classList.remove('show');
    pumpNet();
  };
  const draw = () => {
    /* the very first state is the opening deal: table first, then hands */
    if (!first && !dealt) return settle();
    render();
    setTimeout(settle, (first ? dealSweep(true) : dealSweep(false)) || 0);
  };

  /* a beat after every move so there is time to read what happened */
  const wait = flight ? Math.max(flight, 240) + Math.round(paceMs() * (move.taken ? .55 : .8))
    : (!first && move ? Math.round(paceMs() * .45) : 0);
  if (!wait) return draw();
  animating = true;
  setTimeout(draw, wait);
}

function sendCfg() {
  return netSend({ t: 'cfg', gameId: 'ronda', cfg: { house: { variant: cfg.variant }, target: cfg.target, skill: cfg.skill, speed: cfg.speed, count: cfg.count } });
}

function showLobby() {
  const L = NET && NET.lobby; if (!L) return;
  /* the host's settings reach the server as soon as there is a lobby, so the
     room shows what it is going to be rather than the server's defaults */
  if (NET.isHost && !NET.cfgSent) { NET.cfgSent = true; sendCfg(); }
  const box = $('#lobbyCard');
  box.innerHTML =
    '<h2>ROOM CODE</h2><div class="codeBig">' + esc(L.code) + '</div>' +
    '<div class="codeHint">READ IT OUT — THEY TYPE IT IN AND JOIN</div>' +
    '<div style="font-size:11px;font-weight:800;color:var(--dim);letter-spacing:1px">🃏 RONDA · ' +
    L.players.length + ' AT THE TABLE · TWO, THREE OR FOUR</div>';
  const list = el('div', 'lobList');
  L.players.forEach(p => {
    list.appendChild(el('div', null,
      '<span class="dot' + (p.connected ? '' : ' off') + '"></span>' +
      '<span>' + esc(p.name) + (p.id === ME ? ' (you)' : '') + '</span>' +
      (p.id === L.hostId ? '<span class="tagH">HOST</span>' : p.bot ? '<span class="tagB">BOT</span>' : '')));
  });
  box.appendChild(list);
  /* Does this one count? The host decides, everybody sees the answer, and
     the tables write the result into the night only if it does. */
  const cnt = el('div', 'pill countPill' + (L.cfg && L.cfg.count ? ' on' : ''),
    (L.cfg && L.cfg.count) ? '📒 COUNTS ON THE SCOREBOARD' : '🎈 FRIENDLY — NOT COUNTED');
  if (NET.isHost) cnt.onclick = () => { cfg.count = !(L.cfg && L.cfg.count); sendCfg(); SFX.tick(); };
  else cnt.style.cursor = 'default';
  box.appendChild(cnt);

  if (NET.isHost) {
    if (L.players.length < 4) {
      const bots = el('button', 'act', '🤖 ADD A BOT');
      bots.onclick = () => { netSend({ t: 'addBot' }); SFX.tick(); };
      box.appendChild(bots);
    }
    const ready = L.players.length >= 2 && L.players.length <= 4;
    const go = el('button', 'go', ready ? 'DEAL ▶' : 'AT LEAST TWO…');
    if (ready) go.onclick = () => { ac(); netSend({ t: 'start' }); };
    else { go.style.opacity = '.5'; go.style.cursor = 'default'; }
    box.appendChild(go);
  } else {
    box.appendChild(el('div', null, '<div style="font-size:12px;font-weight:800;color:var(--dim);margin-top:6px">Waiting for ' +
      esc((L.players.find(p => p.id === L.hostId) || {}).name || 'the host') + '…</div>'));
  }
  const leave = el('button', 'act', 'LEAVE');
  leave.style.marginTop = '10px';
  leave.onclick = () => { netLeave(); location.reload(); };
  box.appendChild(leave);
  $('#lobbyOvl').classList.add('show');
}

function setTable(net) {
  $('#tabSolo').classList.toggle('on', !net);
  $('#tabNet').classList.toggle('on', net);
  $('#netBox').classList.toggle('on', net);
  document.querySelectorAll('.soloOnly').forEach(e => e.classList.toggle('hide', net));
  $('#startBtn').style.display = net ? 'none' : '';
  netMsg(net && !SERVER ? 'This build has no server address yet — set uno_server in config.yml.' : '');
}
$('#tabSolo').onclick = () => { setTable(false); SFX.tick(); };
$('#tabNet').onclick = () => { setTable(true); SFX.tick(); };
setTable(false);

const myName = () => {
  const n = ($('#myName').value || 'YOU').trim().slice(0, 14).toUpperCase();
  try { localStorage.setItem('cybergrill_uno_name', n); } catch (e) { }
  return n;
};
$('#createBtn').onclick = async () => {
  if (!SERVER) return netMsg('No server address is configured for this build.');
  ac(); loadSamples(); netMsg('Making a room…');
  try {
    const r = await fetch(SERVER + '/api/room', { method: 'POST' });
    if (!r.ok) throw new Error('the server said no (' + r.status + ')');
    const { code } = await r.json();
    netConnect(code, myName());
    const send = () => {
      if (!sendCfg())
        setTimeout(send, 250);
    };
    setTimeout(send, 400);
  } catch (e) { netMsg(e.message || 'could not reach the server'); }
};
$('#joinBtn').onclick = () => {
  const code = ($('#joinCode').value || '').trim().toUpperCase();
  if (code.length < 3) return netMsg('Type the four-letter code first.');
  if (!SERVER) return netMsg('No server address is configured for this build.');
  ac(); loadSamples(); netMsg('Knocking…');
  netConnect(code, myName());
};
$('#joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });
{
  const q = new URLSearchParams(location.search).get('room');
  if (q) { setTable(true); $('#joinCode').value = q.toUpperCase(); }
}
document.querySelectorAll('.ovl').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o && ['roundOvl', 'lobbyOvl'].indexOf(o.id) === -1) o.classList.remove('show'); });
});
</script>
