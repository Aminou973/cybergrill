<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>CYBERGRILL UNO</title>
<style>
:root{
  --bg:#05060f;--panel:rgba(16,20,44,.72);--line:rgba(120,140,255,.18);
  --txt:#e8ecff;--dim:#8b93c4;--cyan:#22e6ff;--pink:#ff2fb9;--lime:#9cff2e;
  --gold:#ffc93c;--violet:#a55bff;--orange:#ff8a2b;
  --cr:#ff4d5e;--cg:#3ddc6d;--cb:#3d8bff;--cy:#ffd23d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 12% -10%,rgba(34,230,255,.16),transparent 60%),
             radial-gradient(1000px 700px at 92% 8%,rgba(255,47,185,.14),transparent 60%),
             radial-gradient(900px 900px at 50% 120%,rgba(165,91,255,.14),transparent 60%),var(--bg);
  color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:90;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.5) 100%)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------------- setup ---------------- */
#setup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;padding:20px}
#setup.gone{display:none}
.sBox{width:min(94vw,640px);background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:24px;backdrop-filter:blur(10px)}
h1{font-size:min(9vw,44px);font-weight:900;letter-spacing:6px;text-align:center;line-height:1;
  background:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,230,255,.45))}
.sub{text-align:center;font-size:10px;letter-spacing:6px;color:var(--dim);font-weight:800;margin:8px 0 22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:9px;letter-spacing:2.5px;color:var(--dim);font-weight:800;margin-bottom:6px}
.fld input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);
  color:#fff;font-family:inherit;font-weight:800;font-size:16px;letter-spacing:1px}
.fld input:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 20px -6px var(--cyan)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1;min-width:64px;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);cursor:pointer;text-align:center;font-weight:900;font-size:13px;transition:.15s}
.pill:hover{transform:translateY(-2px)}
.pill.on{background:linear-gradient(90deg,var(--cyan),#4df3d0);color:#04121a;border-color:transparent}
.hr2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);margin-bottom:6px;cursor:pointer}
.hr2 .sw{width:36px;height:20px;border-radius:11px;background:rgba(255,255,255,.13);position:relative;flex:0 0 auto;transition:.2s}
.hr2 .sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.hr2.on .sw{background:var(--violet)}
.hr2.on .sw::after{left:19px}
.hr2 b{font-size:11.5px;font-weight:900;letter-spacing:.5px}
.hr2 span{font-size:10px;color:var(--dim);font-weight:700}
.go{width:100%;margin-top:16px;padding:17px;border-radius:15px;border:2px solid var(--lime);cursor:pointer;
  background:linear-gradient(90deg,rgba(156,255,46,.18),rgba(37,230,160,.18));color:var(--lime);
  font-family:inherit;font-weight:900;letter-spacing:5px;font-size:15px;transition:.18s}
.go:hover{background:var(--lime);color:#04120a;transform:scale(1.02)}

/* mode picker */
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeCard{padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);
  cursor:pointer;transition:.16s}
.modeCard:hover{transform:translateY(-2px);border-color:var(--cyan)}
.modeCard.on{border-color:var(--cyan);background:rgba(34,230,255,.12);box-shadow:0 0 22px -7px var(--cyan)}
.modeCard b{display:block;font-size:12px;font-weight:900;letter-spacing:1px}
.modeCard span{display:block;font-size:10px;color:var(--dim);font-weight:700;line-height:1.5;margin-top:4px}
.queueBox{display:none;margin-top:10px}
.queueBox.on{display:block}
.qTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qTag{padding:7px 11px;border-radius:10px;background:var(--gold);color:#120a02;font-size:11px;font-weight:900;cursor:pointer}
.qTag em{font-style:normal;opacity:.6;margin-left:5px}

/* ---------------- table ---------------- */
#table{position:fixed;inset:0;display:none;flex-direction:column}
#table.live{display:flex}
.topline{display:flex;align-items:center;gap:9px;padding:9px 13px;flex:0 0 auto;flex-wrap:wrap}
.logo{font-size:17px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--cyan)}
.spacer{flex:1}
.dirBadge{font-size:15px;filter:drop-shadow(0 0 8px var(--gold))}

.felt{flex:1;position:relative;min-height:0;display:grid;place-items:center}
.felt::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(74vw,760px);height:min(46vh,430px);border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,rgba(34,230,255,.10),rgba(10,14,32,.55) 70%);
  border:2px solid rgba(120,140,255,.22);box-shadow:inset 0 0 70px -18px var(--cyan),0 20px 60px -30px #000}
.seats{position:absolute;inset:0}
.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:112px;transition:.25s}
.seat .av{width:46px;height:46px;border-radius:14px;margin:0 auto 5px;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#04060f;position:relative;box-shadow:0 0 18px -4px currentColor}
.seat.turn .av{box-shadow:0 0 0 3px var(--lime),0 0 30px -2px var(--lime);animation:pulseSeat 1.4s ease-in-out infinite}
@keyframes pulseSeat{50%{box-shadow:0 0 0 5px var(--lime),0 0 40px 0 var(--lime)}}
.seat .nm{font-size:11.5px;font-weight:900;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .cnt{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:1px;margin-top:2px}
.seat .backs{display:flex;justify-content:center;margin-top:5px;height:26px}
.seat .backs i{display:block;width:16px;height:24px;border-radius:3px;margin-left:-9px;
  background:linear-gradient(140deg,#2a3157,#151a33);border:1px solid rgba(255,255,255,.18)}
.seat .backs i:first-child{margin-left:0}
.seat .uno{position:absolute;top:-8px;right:2px;font-size:9px;font-weight:900;letter-spacing:1px;
  padding:3px 6px;border-radius:6px;background:var(--gold);color:#120a02;animation:gpop .3s}
.seat .danger{color:var(--gold)}
.seat.out{opacity:.32;filter:grayscale(1)}
.seat.out .av::after{content:'💀';position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.seat .team{position:absolute;top:-7px;left:-4px;font-size:8px;font-weight:900;letter-spacing:1px;
  padding:2px 6px;border-radius:6px;color:#04060f}
.seat.mate .av{box-shadow:0 0 0 2px var(--lime),0 0 18px -4px currentColor}

/* blitz countdown ring */
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;pointer-events:none}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--lime);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.warn .fg{stroke:var(--gold)}
.ring.crit .fg{stroke:#ff4d5e;animation:critPulse .5s ease-in-out infinite}
@keyframes critPulse{50%{opacity:.4}}
.blitzNum{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:15px;font-weight:900;
  color:var(--lime);text-shadow:0 0 12px currentColor}
.blitzNum.warn{color:var(--gold)} .blitzNum.crit{color:#ff4d5e}

/* a card flying from a hand to the discard */
.flyer{position:fixed;z-index:75;pointer-events:none;border-radius:10px;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(0,0,0,.6);display:grid;place-items:center;font-weight:900;color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.4)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);
  cursor:pointer;text-align:center;font-size:12px;font-weight:900;letter-spacing:1px;transition:.18s}
.tab.on{border-color:var(--gold);background:rgba(255,217,60,.12);color:var(--gold);box-shadow:0 0 22px -8px var(--gold)}
.netBox{display:none} .netBox.on{display:block}
.soloOnly.hide{display:none}
.codeBig{font-size:min(17vw,64px);font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 2px;
  background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.codeHint{text-align:center;font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;margin-bottom:14px}
.lobList{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left}
.lobList div{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;background:rgba(255,255,255,.05);font-size:13px;font-weight:800}
.lobList .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.lobList .dot.off{background:#666;box-shadow:none}
.lobList .tagH{margin-left:auto;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:var(--gold);color:#120a02}
.lobList .tagB{margin-left:auto;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.12);color:var(--dim)}
.netPill{position:fixed;left:12px;bottom:12px;z-index:80;font-size:10px;font-weight:900;letter-spacing:1.5px;
  padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--dim);display:none}
.netPill.on{display:block}
.netPill.live{color:var(--lime);border-color:rgba(156,255,46,.4)}
.netPill.down{color:#ff4d5e;border-color:rgba(255,77,94,.4);animation:critPulse 1s ease-in-out infinite}
.seat.gone{opacity:.5}
.seat.gone .nm::after{content:' 📴'}
.teamBar{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:900;letter-spacing:1px}
.teamBar span{padding:5px 10px;border-radius:9px}
.tA{background:rgba(34,230,255,.18);color:var(--cyan)}
.tB{background:rgba(255,138,43,.18);color:var(--orange)}

.center{position:relative;display:flex;align-items:center;gap:20px;z-index:2}
.pile{width:78px;height:116px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(140deg,#2a3157,#151a33);border:2px solid rgba(255,255,255,.2);
  font-size:11px;font-weight:900;letter-spacing:1px;color:var(--dim);transition:.16s}
.pile:hover{transform:translateY(-3px);border-color:var(--cyan)}
.card{width:78px;height:116px;border-radius:11px;position:relative;display:grid;place-items:center;
  font-weight:900;border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.55);
  background:var(--cc);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.card .big{font-size:34px;line-height:1}
.card .big.sm{font-size:20px;letter-spacing:1px}
.card .cnr{position:absolute;font-size:11px;font-weight:900}
.card .cnr.tl{top:5px;left:7px} .card .cnr.br{bottom:5px;right:7px;transform:rotate(180deg)}
.card.wild{background:conic-gradient(from 45deg,var(--cr),var(--cy),var(--cg),var(--cb),var(--cr))}
.colorNow{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:9px;letter-spacing:2px;
  font-weight:900;padding:4px 10px;border-radius:8px;white-space:nowrap}

/* my hand */
.mine{flex:0 0 auto;padding:6px 10px 12px}
.handWrap{display:flex;justify-content:center;align-items:flex-end;min-height:126px;overflow-x:auto;padding:12px 4px 4px;
  scrollbar-width:none}
.handWrap::-webkit-scrollbar{display:none}
.hcard{width:72px;height:108px;border-radius:10px;flex:0 0 auto;margin-left:-14px;cursor:pointer;
  transition:transform .16s,box-shadow .16s,filter .16s;position:relative;display:grid;place-items:center;
  font-weight:900;border:2px solid rgba(255,255,255,.85);box-shadow:0 5px 14px rgba(0,0,0,.5);
  background:var(--cc);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.hcard:first-child{margin-left:0}
.hcard.wild{background:conic-gradient(from 45deg,var(--cr),var(--cy),var(--cg),var(--cb),var(--cr))}
.hcard.ok:hover{transform:translateY(-26px) scale(1.06);box-shadow:0 16px 30px rgba(0,0,0,.6);z-index:5}
.hcard.ok{transform:translateY(-10px)}
.hcard.no{filter:saturate(.5) brightness(.6);opacity:.82;cursor:default}
.hcard.no:hover{transform:translateY(-6px)}
.hcard .big{font-size:30px;line-height:1}
.hcard .big.sm{font-size:17px;letter-spacing:1px}
.hcard .cnr{position:absolute;font-size:10px;font-weight:900}
.hcard .cnr.tl{top:4px;left:6px} .hcard .cnr.br{bottom:4px;right:6px;transform:rotate(180deg)}

.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.act{padding:13px 20px;border-radius:13px;border:0;cursor:pointer;font-family:inherit;font-weight:900;
  letter-spacing:2px;font-size:12px;transition:.16s;background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--line)}
.act:hover{transform:translateY(-2px)}
.act.draw{background:linear-gradient(90deg,var(--cyan),#4df3d0);color:#04121a;border-color:transparent}
.act.uno{background:linear-gradient(90deg,var(--gold),var(--orange));color:#120a02;border-color:transparent;
  animation:unoPulse 1s ease-in-out infinite}
@keyframes unoPulse{50%{box-shadow:0 0 26px -3px var(--gold)}}
.act.warn{background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff;border-color:transparent}
.act.good{background:linear-gradient(90deg,var(--lime),#25e6a0);color:#04120a;border-color:transparent}

.log{position:fixed;left:12px;bottom:12px;width:min(38vw,300px);max-height:26vh;overflow:hidden;
  display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none;z-index:30}
.log div{font-size:11px;font-weight:700;color:var(--dim);background:rgba(10,14,32,.75);
  padding:5px 9px;border-radius:8px;border-left:2px solid var(--cyan);animation:logIn .3s}
@keyframes logIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes gpop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

/* overlays */
.ovl{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(3,4,12,.82);backdrop-filter:blur(8px)}
.ovl.show{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.oCard{width:min(94vw,460px);background:rgba(12,16,38,.98);border:1px solid var(--line);border-radius:20px;
  padding:26px;text-align:center;animation:pop .4s cubic-bezier(.16,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.oCard h2{font-size:13px;letter-spacing:4px;color:var(--dim);font-weight:800;margin-bottom:18px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sw2{padding:26px;border-radius:15px;cursor:pointer;font-weight:900;font-size:13px;letter-spacing:2px;
  color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);transition:.15s;border:2px solid rgba(255,255,255,.25)}
.sw2:hover{transform:scale(1.06)}
.bigName{font-size:min(11vw,54px);font-weight:900;letter-spacing:2px;line-height:1;margin:10px 0;
  background:linear-gradient(90deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.scoreList{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.scoreList div{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px}
.scoreList div span:last-child{margin-left:auto;font-weight:900;color:var(--gold)}

@media(max-width:860px){
  .seat{width:88px}
  .seat .av{width:38px;height:38px;font-size:13px}
  .pile,.card{width:62px;height:94px}
  .card .big{font-size:26px}
  .hcard{width:58px;height:88px;margin-left:-18px}
  .hcard .big{font-size:24px}
  .log{width:min(60vw,240px);max-height:18vh}
  .act{padding:12px 15px;font-size:11px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="setup"><div class="sBox">
  <h1>CYBERGRILL UNO</h1>
  <div class="sub">P L A Y A B L E</div>

  <div class="tabs">
    <div class="tab on" id="tabSolo">🤖 SOLO VS BOTS</div>
    <div class="tab" id="tabNet">🌍 ONLINE</div>
  </div>

  <div class="fld"><label>YOUR NAME</label><input id="myName" maxlength="14" placeholder="AMIN" autocomplete="off"></div>

  <div class="netBox" id="netBox">
    <div class="fld"><label>START A TABLE, OR JOIN ONE</label>
      <button class="go" id="createBtn" style="margin:0 0 10px">🎲 CREATE A ROOM</button>
      <div class="rin" style="display:flex;gap:8px">
        <input id="joinCode" maxlength="6" placeholder="CODE" autocomplete="off"
          style="flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:#fff;font-family:inherit;font-weight:900;font-size:20px;letter-spacing:6px;text-align:center;text-transform:uppercase">
        <button id="joinBtn" style="padding:0 22px;border-radius:12px;border:0;cursor:pointer;font-weight:900;font-size:13px;letter-spacing:1px;background:linear-gradient(135deg,var(--cyan),#1e9bff);color:#02121a">JOIN</button>
      </div>
      <div id="netMsg" style="font-size:11px;font-weight:800;color:var(--dim);margin-top:9px;min-height:15px"></div>
    </div>
  </div>

  <div class="fld"><label>MODE</label>
    <div class="modeGrid" id="modeGrid"></div>
    <div class="queueBox" id="queueBox">
      <label style="margin-top:10px">WHO IS WAITING FOR A SEAT</label>
      <div class="rin" style="display:flex;gap:8px">
        <input id="qName" maxlength="14" placeholder="NAME" autocomplete="off"
          style="flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:#fff;font-family:inherit;font-weight:800;font-size:16px">
        <button id="qAdd" style="padding:0 18px;border-radius:11px;border:0;cursor:pointer;font-weight:900;font-size:18px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#120a02">+</button>
      </div>
      <div class="qTags" id="qTags"></div>
    </div>
  </div>

  <div class="fld soloOnly" id="botFld"><label>OPPONENTS</label>
    <div class="row2" id="botCount"></div>
  </div>

  <div class="fld"><label>TURN CLOCK</label>
    <div class="row2" id="blitzSel"></div>
  </div>

  <div class="fld"><label>PLAY TO</label>
    <div class="row2" id="targetSel"></div>
  </div>

  <div class="fld"><label>HOUSE RULES — ALL OFF IS THE OFFICIAL GAME</label>
    <div id="houseList"></div>
  </div>

  <button class="go" id="startBtn">DEAL ▶</button>
</div></div>

<div class="ovl" id="lobbyOvl"><div class="oCard" id="lobbyCard"></div></div>
<div class="netPill" id="netPill"></div>

<div id="table">
  <div class="topline">
    <div class="logo">CYBERGRILL UNO</div>
    <span class="dirBadge" id="dirBadge">↻</span>
    <div class="teamBar" id="teamBar" style="display:none"></div>
    <div class="spacer"></div>
    <div class="chip" id="scoresChip">SCORES</div>
    <div class="chip" id="rulesChip">RULES</div>
    <div class="chip" id="quitChip">✕ QUIT</div>
  </div>

  <div class="felt">
    <div class="seats" id="seats"></div>
    <div class="center">
      <div class="pile" id="drawPile">DRAW<br><span id="drawCount"></span></div>
      <div id="discard"></div>
    </div>
  </div>

  <div class="mine">
    <div class="handWrap" id="hand"></div>
    <div class="acts" id="acts"></div>

<script>
/* GAMECFG — written by scripts/build.mjs from config.yml */
window.CG_SERVER = "https://cybergrill-uno.cybergrill.workers.dev";

<script type="module">
/* ---- engine.js, inlined at build time ---- */
/* ==========================================================================
   CyberGrill — UNO rules engine
   --------------------------------------------------------------------------
   Pure ES module. No DOM, no network, no clock. The same file runs in the
   browser and inside the Cloudflare Durable Object, so the server can be the
   referee and the client can predict.

   Everything is a pure-ish transition:

     createGame(opts)            -> state
     legalMoves(state, playerId) -> [move]
     applyMove(state, pid, move) -> { state, events }   (throws on illegal)
     viewFor(state, playerId)    -> redacted state safe to send to that player

   Card ids are unique strings so a client can name exactly which card it means
   even when it holds two identical ones.
   ========================================================================== */

export const COLORS = ['r', 'g', 'b', 'y'];
export const COLOR_NAME = { r: 'RED', g: 'GREEN', b: 'BLUE', y: 'YELLOW' };

/* card kinds: '0'..'9' | 'skip' | 'rev' | 'd2' | 'wild' | 'wd4' */
export function cardValue(kind) {
  if (/^[0-9]$/.test(kind)) return +kind;
  if (kind === 'skip' || kind === 'rev' || kind === 'd2') return 20;
  return 50;                       /* wild, wd4 */
}
export function isWild(kind) { return kind === 'wild' || kind === 'wd4'; }
export function cardLabel(c) {
  const k = { skip: 'SKIP', rev: 'REV', d2: '+2', wild: 'WILD', wd4: '+4' };
  return k[c.kind] || c.kind;
}

/* ---------- deterministic RNG so games are reproducible and testable ---------- */
export function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- the 108-card deck ---------- */
export function buildDeck() {
  const deck = [];
  let n = 0;
  const add = (color, kind) => deck.push({ id: 'c' + (n++), color, kind });
  for (const c of COLORS) {
    add(c, '0');
    for (let v = 1; v <= 9; v++) { add(c, String(v)); add(c, String(v)); }
    for (const k of ['skip', 'rev', 'd2']) { add(c, k); add(c, k); }
  }
  for (let i = 0; i < 4; i++) { add('w', 'wild'); add('w', 'wd4'); }
  return deck;                       /* 4*(1+18+6) + 8 = 108 */
}

/* Game modes.
   classic     — the winner banks the losers' cards, first to the target wins.
   teams       — 2v2, partners opposite each other, the team banks together.
   elimination — nobody banks. Each round the biggest hand left is knocked out
                 and you keep dealing until one player is standing. */
export const MODES = ['classic', 'teams', 'elimination'];

export const DEFAULT_HOUSE = {
  stack: false,        /* answer a +2 with a +2 (or +4 with +4) */
  jumpIn: false,       /* identical card out of turn */
  seven0: false,       /* 7 swaps hands, 0 rotates all hands */
  drawUntil: false,    /* keep drawing until playable */
  noBluff: false,      /* +4 always legal, no challenge */
  randomDir: false     /* the draw also picks the direction */
};

/* ==========================================================================
   create
   ========================================================================== */
export function createGame(opts = {}) {
  const players = (opts.players || []).map((p, i) => ({
    id: p.id || 'p' + i,
    name: p.name || ('Player ' + (i + 1)),
    hand: [],
    said: false,          /* has called UNO for the current 1-card state */
    connected: true,
    score: p.score || 0
  }));
  if (players.length < 2) throw new Error('need at least 2 players');
  if (players.length > 10) throw new Error('at most 10 players');

  const mode = MODES.includes(opts.mode) ? opts.mode : 'classic';
  if (mode === 'teams' && players.length % 2 !== 0) throw new Error('teams needs an even number of players');
  if (mode === 'teams' && players.length < 4) throw new Error('teams needs at least 4 players');
  const house = Object.assign({}, DEFAULT_HOUSE, opts.house || {});
  const seed = (opts.seed === undefined ? 1 : opts.seed) | 0;
  const rnd = mulberry32(seed);

  const state = {
    seed,
    rnd: seed,                 /* current rng cursor is re-derived, see nextRnd */
    rngCalls: 0,
    house,
    mode,
    /* seats alternate, so partners always sit opposite each other */
    teamOf: mode === 'teams'
      ? players.reduce((m, p, i) => { m[p.id] = i % 2 === 0 ? 'A' : 'B'; return m; }, {})
      : null,
    teamScores: mode === 'teams' ? { A: opts.teamScores ? opts.teamScores.A : 0, B: opts.teamScores ? opts.teamScores.B : 0 } : null,
    eliminated: (opts.eliminated || []).slice(),
    target: opts.target || 500,
    players,
    order: players.map(p => p.id),
    turn: 0,
    dir: house.randomDir ? (rnd() < 0.5 ? 1 : -1) : 1,
    draw: [],
    discard: [],
    color: null,
    pending: 0,               /* accumulated +2/+4 waiting to be taken */
    pendingKind: null,        /* 'd2' | 'wd4' — what may be stacked on it */
    drawnThisTurn: null,      /* card id the current player just drew */
    challenge: null,          /* { by, from, cardId } while a +4 can be challenged */
    phase: 'playing',
    roundWinner: null,
    winner: null,
    round: opts.round || 1,
    log: []
  };

  /* deal */
  const deck = shuffle(buildDeck(), rnd);
  for (let i = 0; i < 7; i++) for (const p of players) p.hand.push(deck.pop());

  /* first card — a +4 goes back and we flip another */
  let first = deck.pop();
  while (first.kind === 'wd4') {
    deck.unshift(first);
    shuffle(deck, rnd);
    first = deck.pop();
  }
  state.draw = deck;
  state.discard = [first];
  state.color = first.color === 'w' ? null : first.color;
  state.rngCalls = 0;
  state._rndState = seed ^ 0x9e3779b9;   /* separate stream for later reshuffles */

  const ev = [{ t: 'deal', first: first.id }];

  /* the very first card applies immediately */
  switch (first.kind) {
    case 'skip':
      ev.push({ t: 'skip', who: state.order[state.turn] });
      advance(state, 1);
      break;
    case 'rev':
      state.dir *= -1;
      ev.push({ t: 'reverse' });
      /* with the direction flipped, play starts at the dealer's other side */
      state.turn = (players.length + (state.dir === 1 ? -1 : 1)) % players.length;
      if (state.turn < 0) state.turn += players.length;
      break;
    case 'd2':
      ev.push({ t: 'forceDraw', who: state.order[state.turn], n: 2 });
      drawCards(state, currentPlayer(state), 2);
      advance(state, 1);
      break;
    case 'wild':
      state.color = null;            /* first player names it before playing */
      ev.push({ t: 'needColor', who: state.order[state.turn] });
      break;
  }
  state.log = ev;
  return state;
}

/* ---------- helpers ---------- */
function rndFor(state) {
  /* a fresh stream seeded from the state so reshuffles stay deterministic */
  const r = mulberry32((state._rndState ^ (state.rngCalls * 2654435761)) >>> 0);
  state.rngCalls++;
  return r;
}
export function currentPlayer(state) { return state.players.find(p => p.id === state.order[state.turn]); }
export function playerById(state, id) { return state.players.find(p => p.id === id); }
export function topCard(state) { return state.discard[state.discard.length - 1]; }
function seatOf(state, id) { return state.order.indexOf(id); }
function advance(state, steps = 1) {
  const n = state.order.length;
  state.turn = (((state.turn + state.dir * steps) % n) + n) % n;
}
function peekNext(state, steps = 1) {
  const n = state.order.length;
  return state.order[(((state.turn + state.dir * steps) % n) + n) % n];
}
function reshuffleIfNeeded(state) {
  if (state.draw.length) return;
  const top = state.discard.pop();
  const rest = state.discard;
  state.discard = [top];
  if (!rest.length) return;                 /* genuinely nothing left */
  state.draw = shuffle(rest.map(c => (isWild(c.kind) ? { ...c, color: 'w' } : c)), rndFor(state));
}
function drawCards(state, player, n) {
  const got = [];
  for (let i = 0; i < n; i++) {
    reshuffleIfNeeded(state);
    if (!state.draw.length) break;
    const c = state.draw.pop();
    player.hand.push(c);
    got.push(c);
  }
  if (player.hand.length > 1) player.said = false;
  return got;
}

/* ---------- legality ---------- */
export function cardPlayable(state, card, player) {
  const top = topCard(state);
  /* a pending draw stack narrows everything down */
  if (state.pending > 0) {
    if (!state.house.stack) return false;
    if (state.pendingKind === 'd2') return card.kind === 'd2';
    return card.kind === 'wd4';
  }
  /* A Wild Draw Four can always be put down. Official rules say you should
     only play it with no card of the current colour — but they also give the
     next player a challenge, which only makes sense if bluffing is possible.
     So we allow the play and let the challenge settle it. */
  if (card.kind === 'wd4') return true;
  if (card.kind === 'wild') return true;
  if (state.color === null) return true;              /* colour not yet named */
  if (card.color === state.color) return true;
  return card.kind === top.kind && !isWild(top.kind);
}

export function legalMoves(state, playerId) {
  const out = [];
  if (state.phase !== 'playing') return out;
  const me = playerById(state, playerId);
  if (!me) return out;

  /* anyone may catch a player who failed to call UNO */
  for (const p of state.players) {
    if (p.id !== playerId && p.hand.length === 1 && !p.said) out.push({ type: 'catch', targetId: p.id });
  }
  /* you shout UNO as you play your second-to-last card — and the shout is
     still valid a beat later, as long as nobody has caught you yet. So this
     is deliberately not gated on whose turn it is. */
  if (me.hand.length === 1 && !me.said) out.push({ type: 'sayUno' });
  /* the +4 challenge belongs to the player it was aimed at */
  if (state.challenge && state.challenge.by === playerId) {
    out.push({ type: 'challenge' });
    out.push({ type: 'accept' });
    return out;
  }
  /* jump-in: exact same colour and kind, out of turn */
  if (state.house.jumpIn && state.order[state.turn] !== playerId && state.pending === 0) {
    const top = topCard(state);
    for (const c of me.hand) {
      if (c.color === top.color && c.kind === top.kind && !isWild(c.kind)) {
        out.push({ type: 'play', cardId: c.id, jumpIn: true });
      }
    }
  }
  if (state.order[state.turn] !== playerId) return out;

  /* my turn */
  if (state.pending > 0) {
    for (const c of me.hand) if (cardPlayable(state, c, me)) out.push({ type: 'play', cardId: c.id });
    out.push({ type: 'takeStack' });
    return out;
  }
  if (state.drawnThisTurn) {
    const c = me.hand.find(x => x.id === state.drawnThisTurn);
    if (c && cardPlayable(state, c, me)) out.push({ type: 'play', cardId: c.id });
    out.push({ type: 'pass' });
    return out;
  }
  for (const c of me.hand) if (cardPlayable(state, c, me)) out.push({ type: 'play', cardId: c.id });
  out.push({ type: 'draw' });
  return out;
}

function hasLegal(state, player) {
  return player.hand.some(c => cardPlayable(state, c, player));
}

/* ---------- scoring ---------- */
export function handValue(player) {
  return player.hand.reduce((s, c) => s + cardValue(c.kind), 0);
}
function endRound(state, winner, events) {
  const detail = {};
  for (const p of state.players) if (p.id !== winner.id) detail[p.id] = handValue(p);
  state.roundWinner = winner.id;
  state.phase = 'roundEnd';

  if (state.mode === 'elimination') {
    /* nobody banks — whoever is left holding the most goes out */
    let worst = null, worstV = -1;
    for (const p of state.players) {
      if (p.id === winner.id) continue;
      const v = handValue(p);
      if (v > worstV || (v === worstV && worst && p.hand.length > worst.hand.length)) { worst = p; worstV = v; }
    }
    if (worst) {
      state.eliminated.push(worst.id);
      events.push({ t: 'eliminated', who: worst.id, value: worstV });
    }
    const left = state.players.filter(p => state.eliminated.indexOf(p.id) === -1);
    events.push({ t: 'roundEnd', winner: winner.id, total: 0, detail, eliminated: worst ? worst.id : null });
    if (left.length <= 1) {
      state.winner = left.length ? left[0].id : winner.id;
      state.phase = 'gameEnd';
      events.push({ t: 'gameEnd', winner: state.winner });
    }
    return;
  }

  if (state.mode === 'teams') {
    const team = state.teamOf[winner.id];
    let total = 0;
    for (const p of state.players) if (state.teamOf[p.id] !== team) total += handValue(p);
    state.teamScores[team] += total;
    /* mirror it onto the members so existing score displays keep working */
    for (const p of state.players) if (state.teamOf[p.id] === team) p.score = state.teamScores[team];
    events.push({ t: 'roundEnd', winner: winner.id, team, total, detail });
    if (state.teamScores[team] >= state.target) {
      state.winner = winner.id;
      state.winningTeam = team;
      state.phase = 'gameEnd';
      events.push({ t: 'gameEnd', winner: winner.id, team, score: state.teamScores[team] });
    }
    return;
  }

  let total = 0;
  for (const id of Object.keys(detail)) total += detail[id];
  winner.score += total;
  events.push({ t: 'roundEnd', winner: winner.id, total, detail });
  if (winner.score >= state.target) {
    state.winner = winner.id;
    state.phase = 'gameEnd';
    events.push({ t: 'gameEnd', winner: winner.id, score: winner.score });
  }
}

/* ==========================================================================
   apply
   ========================================================================== */
export function applyMove(state, playerId, move) {
  const s = clone(state);
  const events = [];
  const me = playerById(s, playerId);
  if (!me) throw new Error('no such player');
  if (s.phase !== 'playing') throw new Error('round is over');

  const ok = legalMoves(s, playerId).some(m => sameMove(m, move));
  if (!ok) throw new Error('illegal move: ' + JSON.stringify(move));

  switch (move.type) {

    case 'sayUno':
      me.said = true;
      events.push({ t: 'uno', who: me.id });
      break;

    case 'catch': {
      const victim = playerById(s, move.targetId);
      drawCards(s, victim, 4);
      victim.said = false;
      events.push({ t: 'caught', who: victim.id, by: me.id, n: 4 });
      break;
    }

    case 'challenge': {
      const ch = s.challenge;
      const accused = playerById(s, ch.from);
      /* was it a bluff? we kept the colour that was live when it was played */
      const bluffed = accused._preWd4Hand.some(c => c.color === ch.colorAtPlay);
      s.challenge = null;
      if (bluffed) {
        drawCards(s, accused, 4);
        events.push({ t: 'challengeWon', by: me.id, from: accused.id });
      } else {
        drawCards(s, me, 6);
        events.push({ t: 'challengeLost', by: me.id, from: accused.id });
      }
      s.pending = 0; s.pendingKind = null;
      advance(s, 1);                      /* the +4 target loses their turn either way */
      break;
    }

    case 'accept': {
      s.challenge = null;
      drawCards(s, me, s.pending || 4);
      events.push({ t: 'forceDraw', who: me.id, n: s.pending || 4 });
      s.pending = 0; s.pendingKind = null;
      advance(s, 1);
      break;
    }

    case 'takeStack': {
      drawCards(s, me, s.pending);
      events.push({ t: 'forceDraw', who: me.id, n: s.pending });
      s.pending = 0; s.pendingKind = null;
      advance(s, 1);
      break;
    }

    case 'draw': {
      const got = drawCards(s, me, 1);
      events.push({ t: 'drew', who: me.id, n: got.length });
      if (s.house.drawUntil) {
        let guard = 0;
        while (got.length && !cardPlayable(s, got[got.length - 1], me) && guard++ < 200) {
          const more = drawCards(s, me, 1);
          if (!more.length) break;
          got.push(more[0]);
        }
        events.push({ t: 'drewUntil', who: me.id, n: got.length });
      }
      const last = got[got.length - 1];
      if (last && cardPlayable(s, last, me)) s.drawnThisTurn = last.id;
      else { s.drawnThisTurn = null; advance(s, 1); }
      break;
    }

    case 'pass':
      s.drawnThisTurn = null;
      events.push({ t: 'passed', who: me.id });
      advance(s, 1);
      break;

    case 'play': {
      const idx = me.hand.findIndex(c => c.id === move.cardId);
      const card = me.hand[idx];
      if (move.jumpIn) {
        s.turn = seatOf(s, me.id);        /* play continues from the jumper */
        events.push({ t: 'jumpIn', who: me.id });
      }
      /* remember the hand before a +4 leaves it, for the challenge */
      if (card.kind === 'wd4') me._preWd4Hand = me.hand.filter(c => c.id !== card.id).map(c => ({ ...c }));

      me.hand.splice(idx, 1);
      s.drawnThisTurn = null;
      const played = isWild(card.kind) ? { ...card, color: 'w' } : card;
      s.discard.push(played);
      events.push({ t: 'played', who: me.id, card: played.id, kind: card.kind, color: card.color });

      if (isWild(card.kind)) {
        const chosen = COLORS.includes(move.color) ? move.color : COLORS[0];
        s.color = chosen;
        events.push({ t: 'color', who: me.id, color: chosen });
      } else {
        s.color = card.color;
      }

      /* going out */
      if (me.hand.length === 0) {
        /* a +2 or +4 as the last card still hits the next player */
        if (card.kind === 'd2') { drawCards(s, playerById(s, peekNext(s, 1)), 2); events.push({ t: 'forceDraw', who: peekNext(s, 1), n: 2 }); }
        if (card.kind === 'wd4') { drawCards(s, playerById(s, peekNext(s, 1)), 4); events.push({ t: 'forceDraw', who: peekNext(s, 1), n: 4 }); }
        endRound(s, me, events);
        return { state: s, events };
      }
      if (me.hand.length !== 1) me.said = false;

      /* effects */
      const twoPlayer = s.order.length === 2;
      switch (card.kind) {
        case 'skip':
          events.push({ t: 'skip', who: peekNext(s, 1) });
          advance(s, 2);
          break;
        case 'rev':
          if (twoPlayer) { events.push({ t: 'skip', who: peekNext(s, 1) }); advance(s, 2); }
          else { s.dir *= -1; events.push({ t: 'reverse' }); advance(s, 1); }
          break;
        case 'd2':
          s.pending += 2; s.pendingKind = 'd2';
          advance(s, 1);
          if (!s.house.stack || !hasStackable(s)) {
            const v = currentPlayer(s);
            drawCards(s, v, s.pending);
            events.push({ t: 'forceDraw', who: v.id, n: s.pending });
            s.pending = 0; s.pendingKind = null;
            advance(s, 1);
          }
          break;
        case 'wd4':
          s.pending += 4; s.pendingKind = 'wd4';
          advance(s, 1);
          if (!s.house.noBluff) {
            s.challenge = { by: s.order[s.turn], from: me.id, cardId: card.id, colorAtPlay: colorBefore(s) };
            events.push({ t: 'challengeOpen', by: s.order[s.turn], from: me.id });
          } else if (!s.house.stack || !hasStackable(s)) {
            const v = currentPlayer(s);
            drawCards(s, v, s.pending);
            events.push({ t: 'forceDraw', who: v.id, n: s.pending });
            s.pending = 0; s.pendingKind = null;
            advance(s, 1);
          }
          break;
        case '7':
          if (s.house.seven0) {
            const other = playerById(s, move.target) || playerById(s, peekNext(s, 1));
            const tmp = me.hand; me.hand = other.hand; other.hand = tmp;
            events.push({ t: 'swap', a: me.id, b: other.id });
            advance(s, 1);
          } else advance(s, 1);
          break;
        case '0':
          if (s.house.seven0) {
            const hands = s.order.map(id => playerById(s, id).hand);
            const rotated = s.dir === 1 ? [hands[hands.length - 1], ...hands.slice(0, -1)]
                                        : [...hands.slice(1), hands[0]];
            s.order.forEach((id, i) => { playerById(s, id).hand = rotated[i]; });
            events.push({ t: 'rotate', dir: s.dir });
            advance(s, 1);
          } else advance(s, 1);
          break;
        default:
          advance(s, 1);
      }
      break;
    }

    default:
      throw new Error('unknown move');
  }
  return { state: s, events };
}

function colorBefore(s) {
  /* the colour that was in force just before the +4 landed */
  for (let i = s.discard.length - 2; i >= 0; i--) {
    const c = s.discard[i];
    if (c.color !== 'w') return c.color;
  }
  return null;
}
function hasStackable(s) {
  const p = currentPlayer(s);
  if (!p) return false;
  return p.hand.some(c => (s.pendingKind === 'd2' ? c.kind === 'd2' : c.kind === 'wd4'));
}
function sameMove(a, b) {
  if (!b || a.type !== b.type) return false;
  if (a.type === 'play') return a.cardId === b.cardId && !!a.jumpIn === !!b.jumpIn;
  if (a.type === 'catch') return a.targetId === b.targetId;
  return true;
}
function clone(s) {
  return JSON.parse(JSON.stringify(s));
}

/* ==========================================================================
   start the next round — same players, scores carried, fresh deal
   ========================================================================== */
export function nextRound(state, opts = {}) {
  /* winner-stays-on hands us a new roster; elimination just drops the fallen */
  let roster = opts.players
    ? opts.players.map(p => ({ id: p.id, name: p.name, score: p.score || 0 }))
    : state.players
        .filter(p => state.eliminated.indexOf(p.id) === -1)
        .map(p => ({ id: p.id, name: p.name, score: p.score }));
  const s = createGame({
    players: roster,
    seed: (state.seed * 1103515245 + 12345) >>> 0,
    house: state.house,
    mode: opts.players ? 'classic' : state.mode,
    teamScores: state.teamScores,
    target: state.target,
    round: state.round + 1
  });
  /* the previous round's winner deals, so the seat after them starts */
  if (state.roundWinner) {
    const w = s.order.indexOf(state.roundWinner);
    if (w >= 0) s.turn = (w + (s.dir === 1 ? 1 : s.order.length - 1)) % s.order.length;
  }
  return s;
}

/* ==========================================================================
   what one player is allowed to see
   ========================================================================== */
export function viewFor(state, playerId) {
  const me = playerById(state, playerId);
  return {
    round: state.round,
    phase: state.phase,
    target: state.target,
    house: state.house,
    mode: state.mode,
    teamOf: state.teamOf,
    teamScores: state.teamScores,
    eliminated: state.eliminated,
    winningTeam: state.winningTeam || null,
    turn: state.order[state.turn],
    dir: state.dir,
    color: state.color,
    pending: state.pending,
    pendingKind: state.pendingKind,
    challenge: state.challenge ? { by: state.challenge.by, from: state.challenge.from } : null,
    drawnThisTurn: state.order[state.turn] === playerId ? state.drawnThisTurn : null,
    drawCount: state.draw.length,
    top: topCard(state),
    you: me ? { id: me.id, name: me.name, hand: me.hand, said: me.said, score: me.score } : null,
    players: state.order.map(id => {
      const p = playerById(state, id);
      return { id: p.id, name: p.name, count: p.hand.length, said: p.said, score: p.score, connected: p.connected };
    }),
    roundWinner: state.roundWinner,
    winner: state.winner,
    moves: legalMoves(state, playerId)

}

/* a tiny bot, handy for testing and for filling an empty seat */
export function botMove(state, playerId, rnd = Math.random) {
  const ms = legalMoves(state, playerId);
  if (!ms.length) return null;
  const plays = ms.filter(m => m.type === 'play');
  const say = ms.find(m => m.type === 'sayUno');
  if (say) return say;                                  /* never forget UNO */
  if (plays.length) {
    const m = plays[Math.floor(rnd() * plays.length)];
    const me = playerById(state, playerId);
    const card = me.hand.find(c => c.id === m.cardId);
    if (card && isWild(card.kind)) {
      const counts = {};
      me.hand.forEach(c => { if (c.color !== 'w') counts[c.color] = (counts[c.color] || 0) + 1; });
      const best = COLORS.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0))[0];
      return { ...m, color: best };
    }
    if (card && card.kind === '7' && state.house.seven0) {
      const others = state.players.filter(p => p.id !== playerId).sort((a, b) => a.hand.length - b.hand.length);
      return { ...m, target: others[0] && others[0].id };
    }
    return m;
  }
  const order = ['accept', 'takeStack', 'draw', 'pass', 'catch', 'challenge'];
  for (const t of order) { const m = ms.find(x => x.type === t); if (m) return m; }
  return ms[0];
}

function burst(x, y, n, colors) {
  for (let i = 0; i < (n || 40); i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 10;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, g: .25 + Math.random() * .15,
      life: 1, dec: .008 + Math.random() * .01, c: (colors || PALETTE)[(Math.random() * (colors || PALETTE).length) | 0],

  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99; p.r += p.vr; p.life -= p.dec;

  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  requestAnimationFrame(() => {
    f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (((Math.random() * 24) | 0) - 12) + 'deg) scale(1)';
  });
  setTimeout(() => f.remove(), 340);
}

/* ---------------- blitz turn clock ---------------- */
const RING_C = 2 * Math.PI * 33;
let clockKey = null, clockT = null, clockLeft = 0, lastBeep = -1;
function stopClock() {
  if (clockT) { clearInterval(clockT); clockT = null; }
  clockKey = null; lastBeep = -1;
  document.querySelectorAll('.ring,.blitzNum').forEach(e => e.remove());
}
function mountRing() {
  const seat = $('#mySeat'); if (!seat) return null;
  let r = seat.querySelector('.ring');
  if (!r) {
    seat.insertAdjacentHTML('afterbegin',
      '<div class="blitzNum"></div>' +
      '<svg class="ring" viewBox="0 0 74 74" style="top:23px">' +
      '<circle class="bg" cx="37" cy="37" r="33"></circle>' +
      '<circle class="fg" cx="37" cy="37" r="33" transform="rotate(-90 37 37)" ' +
      'stroke-dasharray="' + RING_C.toFixed(1) + '"></circle></svg>');
    r = seat.querySelector('.ring');
  }
  return r;
}
function paintClock() { paintClockWith(cfg.blitz); }
function paintClockWith(limit) {
  const r = $('#mySeat') && $('#mySeat').querySelector('.ring');
  const num = $('#mySeat') && $('#mySeat').querySelector('.blitzNum');
  if (!r || !limit) return;
  const frac = Math.max(0, clockLeft / limit);
  const cls = frac < .25 ? 'crit' : frac < .5 ? 'warn' : '';
  r.setAttribute('class', 'ring ' + cls);
  r.querySelector('.fg').setAttribute('stroke-dashoffset', (RING_C * (1 - frac)).toFixed(1));
  if (num) {
    num.className = 'blitzNum ' + cls;
    num.textContent = Math.ceil(clockLeft) + 's';
  }
  const whole = Math.ceil(clockLeft);
  if (whole <= 3 && whole !== lastBeep) { lastBeep = whole; SFX.tick(); }
}
function syncClock() {
  const limit = NET ? (NET.blitz || 0) : cfg.blitz;
  const active = G && G.phase === 'playing' && limit > 0 && G.order[G.turn] === ME;
  if (!active) { stopClock(); return; }
  if (NET) {
    /* the deadline is the server's, shifted by our measured clock offset */
    const left = (NET.deadline - (Date.now() + NET.skew)) / 1000;
    if (clockKey !== 'net' + NET.deadline) { clockKey = 'net' + NET.deadline; lastBeep = -1; }
    clockLeft = Math.max(0, Math.min(limit, left));
    mountRing(); paintClockWith(limit);
    if (!clockT) clockT = setInterval(() => {
      clockLeft = Math.max(0, (NET.deadline - (Date.now() + NET.skew)) / 1000);
      paintClockWith(limit);
    }, 100);
    return;
  }
  if (clockKey !== G.round + '|' + G.turn) { clockKey = G.round + '|' + G.turn; clockLeft = cfg.blitz; lastBeep = -1; }
  mountRing(); paintClock();
  if (!clockT) clockT = setInterval(() => {
    clockLeft -= .1;
    if (clockLeft <= 0) { stopClock(); blitzTimeout(); return; }
    paintClock();
  }, 100);
}
function blitzTimeout() {
  if (!G || G.phase !== 'playing' || G.order[G.turn] !== ME) return;
  SFX.bad(); logLine('⏱️ out of time — drawing and passing');
  const has = t => legalMoves(G, ME).some(m => m.type === t);
  if (has('takeStack')) return doMove({ type: 'takeStack' });
  if (has('accept')) return doMove({ type: 'accept' });
  if (has('draw')) {
    doMove({ type: 'draw' });
    setTimeout(() => {
      if (G && G.phase === 'playing' && G.order[G.turn] === ME &&
          legalMoves(G, ME).some(m => m.type === 'pass')) doMove({ type: 'pass' });
    }, 300);
    return;
  }
  if (has('pass')) doMove({ type: 'pass' });
}

/* ---------------- moves ---------------- */
let flySrc = null;
function tryPlay(card) {
  if (busy) return;
  if (isWild(card.kind)) { pendingWild = card; $('#colorOvl').classList.add('show'); return; }
  if (card.kind === '7' && G.house.seven0 && G.order.length > 2) { pickSwapTarget(card); return; }
  doMove({ type: 'play', cardId: card.id });
}
document.querySelectorAll('.sw2').forEach(s => {
  s.onclick = () => {
    $('#colorOvl').classList.remove('show');
    const c = s.dataset.c;
    doMove({ type: 'play', cardId: pendingWild.id, color: c });
    pendingWild = null;
  };
});
function pickSwapTarget(card) {
  const box = $('#pickCard');
  box.innerHTML = '<h2>SWAP HANDS WITH</h2>';
  G.order.filter(id => id !== ME).forEach(id => {
    const p = playerById(G, id);
    const b = el('button', 'act good', esc(p.name) + ' (' + p.hand.length + ')');
    b.style.margin = '5px';
    b.onclick = () => { $('#pickOvl').classList.remove('show'); doMove({ type: 'play', cardId: card.id, target: id }); };
    box.appendChild(b);
  });
  $('#pickOvl').classList.add('show');
}

function doMove(move) {
  if (busy || !G) return;
  if (NET) { netSend({ t: 'move', move }); return; }
  try {
    const r = applyMove(G, ME, move);
    G = r.state;
    showEvents(r.events);
    render();
    if (G.phase !== 'playing') return showRoundEnd();
    tickBots();
  } catch (e) { SFX.bad(); logLine('⚠ ' + e.message); }
}

function tickBots() {
  if (NET) return;            /* the server plays the bots, and plays fair */
  if (!G || G.phase !== 'playing') return;
  const actor = G.order[G.turn];
  /* a bot may also need to catch or challenge out of turn */
  const outOfTurn = G.order.find(id => id !== ME && id !== actor &&
    legalMoves(G, id).some(m => m.type === 'challenge'));
  const who = outOfTurn || actor;
  if (who === ME) { maybeBotCatchMe(); return; }
  busy = true;
  setTimeout(() => {
    if (!G || G.phase !== 'playing') { busy = false; return; }
    const m = botMove(G, who);
    if (!m) { busy = false; return; }
    if (m.type === 'play') flySrc = seatRect(who);
    try {
      const r = applyMove(G, who, m);
      G = r.state; showEvents(r.events); render();
    } catch (e) { /* skip a bot that has nothing legal */ }
    busy = false;
    if (G.phase !== 'playing') return showRoundEnd();
    tickBots();
  }, 620 + Math.random() * 420);
}
function maybeBotCatchMe() {
  /* bots pounce on a missed UNO about half the time, after a beat */
  const me = playerById(G, ME);
  if (!me || me.hand.length !== 1 || me.said) return;
  const hunter = G.order.find(id => id !== ME);
  if (!hunter || Math.random() > .55) return;
  setTimeout(() => {
    if (!G || G.phase !== 'playing') return;
    const m = legalMoves(G, hunter).find(x => x.type === 'catch' && x.targetId === ME);
    if (!m) return;
    const r = applyMove(G, hunter, m);
    G = r.state; showEvents(r.events); render();
  }, 1500 + Math.random() * 1200);
}

/* ---------------- events → log, sound, confetti ---------------- */
function nameOf(id) { const p = playerById(G, id); return p ? p.name : '?'; }
function logLine(t) {
  const l = $('#log');
  l.insertBefore(el('div', null, t), l.firstChild);
  while (l.children.length > 9) l.removeChild(l.lastChild);
}
function showEvents(evs) {
  evs.forEach(e => {
    switch (e.t) {
      case 'played':
        SFX.play(); landed = true;
        flyCard(flySrc, { kind: e.kind, color: e.color }); flySrc = null;
        logLine(nameOf(e.who) + ' played ' + (e.color !== 'w' ? COLOR_NAME[e.color] + ' ' : '') + cardLabel({ kind: e.kind }));
        break;
      case 'eliminated': SFX.hit(); logLine('💀 ' + nameOf(e.who) + ' is out — ' + e.value + ' left in hand'); break;
      case 'color': logLine(nameOf(e.who) + ' called ' + COLOR_NAME[e.color]); break;
      case 'drew': SFX.draw(); logLine(nameOf(e.who) + ' drew a card'); break;
      case 'drewUntil': SFX.draw(); logLine(nameOf(e.who) + ' drew ' + e.n + ' until playable'); break;
      case 'forceDraw': SFX.hit(); logLine('💥 ' + nameOf(e.who) + ' picks up ' + e.n); break;
      case 'skip': SFX.skip(); logLine('⛔ ' + nameOf(e.who) + ' is skipped'); break;
      case 'reverse': SFX.rev(); logLine('🔄 direction reversed'); break;
      case 'uno': SFX.uno(); logLine('🗣️ ' + nameOf(e.who) + ' calls UNO!'); burst(innerWidth / 2, innerHeight - 120, 24, ['#ffc93c']); break;
      case 'caught': SFX.hit(); logLine('👉 ' + nameOf(e.who) + ' was caught by ' + nameOf(e.by) + ' — 4 cards'); break;
      case 'challengeOpen': logLine('🕵️ ' + nameOf(e.by) + ' may challenge that +4'); break;
      case 'challengeWon': SFX.hit(); logLine('✅ ' + nameOf(e.by) + ' called the bluff — ' + nameOf(e.from) + ' draws 4'); break;
      case 'challengeLost': SFX.hit(); logLine('❌ ' + nameOf(e.by) + ' challenged wrongly — draws 6'); break;
      case 'swap': logLine('🔀 ' + nameOf(e.a) + ' swapped hands with ' + nameOf(e.b)); break;
      case 'rotate': logLine('🔁 everyone passed their hand along'); break;
      case 'jumpIn': logLine('⚡ ' + nameOf(e.who) + ' jumped in!'); break;
      case 'passed': logLine(nameOf(e.who) + ' passed'); break;
    }
  });
}

/* ---------------- round / game end ---------------- */
const handVal = p => p.hand.reduce((t, c) => t + cardValue(c.kind), 0);
/* Online we never hold other people's cards, so the round-end totals come from
   the server's own roundEnd event rather than from a hand we cannot see. */
const valOf = p => (NET && NET.detail && p.id in NET.detail) ? NET.detail[p.id] : handVal(p);
let guestIx = 0;

function showRoundEnd() {
  stopClock();
  const winner = playerById(G, G.roundWinner) || playerById(G, G.winner);
  SFX.win();
  for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .4, 40), i * 140);

  /* elimination: remember the fallen so they stay at the table as ghosts */
  let justOut = null;
  if (G.mode === 'elimination') {
    G.eliminated.forEach(id => {
      if (KO.some(k => k.id === id)) return;
      const p = playerById(G, id);
      if (p) { justOut = p; KO.push({ id, name: p.name, round: G.round }); }
    });
  }

  /* winner-stays-on: last place gives up the seat */
  let swap = null;
  if (!NET && cfg.mode === 'stayson' && G.phase !== 'gameEnd') {
    const losers = G.order.filter(id => id !== G.roundWinner).map(id => playerById(G, id))
      .sort((a, b) => valOf(b) - valOf(a) || b.hand.length - a.hand.length);
    if (losers.length && QUEUE.length) swap = { out: losers[0], in: QUEUE[0] };
  }

  const box = $('#roundCard');
  const gameOver = G.phase === 'gameEnd';
  const teamWin = G.winningTeam;
  let crown = gameOver ? '🏆' : '🎉', head = gameOver ? 'WINS THE GAME' : 'WINS THE ROUND', big = winner.name;
  if (G.teamScores) {
    const t = teamOf(winner.id);
    head = gameOver ? 'TAKE THE GAME' : 'TAKE THE ROUND';
    big = 'TEAM ' + (gameOver ? (teamWin || t) : t);
    crown = gameOver ? '🏆' : '🤝';
  }
  if (gameOver && G.mode === 'elimination') { crown = '👑'; head = 'IS THE LAST ONE STANDING'; }

  box.innerHTML =
    '<div style="font-size:52px">' + crown + '</div>' +
    '<div class="bigName">' + esc(big) + '</div>' +
    '<h2>' + head + '</h2>' +
    (G.teamScores && !gameOver ? '<div style="font-size:11px;color:var(--dim);font-weight:800;letter-spacing:1px">' +
      esc(winner.name) + ' WENT OUT FIRST</div>' : '') +
    (justOut ? '<div style="margin-top:12px;font-size:14px;font-weight:900;color:#ff4d5e">💀 ' +
      esc(justOut.name) + ' IS ELIMINATED</div>' : '');

  const list = el('div', 'scoreList');
  if (G.teamScores) {
    [['A', G.teamScores.A], ['B', G.teamScores.B]].sort((a, b) => b[1] - a[1]).forEach(([t, sc]) => {
      const mates = G.order.filter(id => teamOf(id) === t).map(id => playerById(G, id).name).join(' + ');
      list.appendChild(el('div', null,
        '<span style="width:10px;height:10px;border-radius:3px;background:' +
        (t === 'A' ? 'var(--cyan)' : 'var(--orange)') + ';display:inline-block"></span>' +
        '<span>TEAM ' + t + ' &middot; ' + esc(mates) + '</span><span>' + sc + '</span>'));
    });
  } else if (G.mode === 'elimination') {
    G.order.map(id => playerById(G, id))
      .filter(p => G.eliminated.indexOf(p.id) === -1)
      .sort((a, b) => valOf(a) - valOf(b)).forEach(p => {
        list.appendChild(el('div', null,
          '<span style="width:10px;height:10px;border-radius:3px;background:' + colorOf(p.id) + ';display:inline-block"></span>' +
          '<span>' + esc(p.name) + '</span><span>' + (p.id === winner.id ? '✅' : valOf(p)) + '</span>'));
      });
    KO.slice().reverse().forEach(k => {
      list.appendChild(el('div', null,
        '<span style="width:10px;height:10px;border-radius:3px;background:' + colorOf(k.id) + ';opacity:.4;display:inline-block"></span>' +
        '<span style="opacity:.45">' + esc(k.name) + '</span><span style="opacity:.45">OUT R' + k.round + '</span>'));
    });
  } else {
    G.order.map(id => playerById(G, id)).sort((a, b) => b.score - a.score).forEach(p => {
      list.appendChild(el('div', null,
        '<span style="width:10px;height:10px;border-radius:3px;background:' + colorOf(p.id) + ';display:inline-block"></span>' +
        '<span>' + esc(p.name) + '</span><span>' + p.score + '</span>'));
    });
  }
  box.appendChild(list);

  if (swap) box.appendChild(el('div', null,
    '<div style="font-size:12px;font-weight:900;letter-spacing:1px;color:var(--gold);margin-top:4px">' +
    '🔁 ' + esc(swap.out.name) + ' STEPS OUT &nbsp;·&nbsp; ' + esc(swap.in) + ' SITS DOWN</div>' +
    (swap.out.id === ME
      ? '<div style="font-size:10px;color:var(--dim);font-weight:700;margin-top:5px">' +
        'That is your seat — hand the device over. You are ' + esc(swap.in) + ' from now on.</div>'
      : '')));

  const b = el('button', 'go', gameOver ? 'PLAY AGAIN' : 'NEXT ROUND ▶');
  if (NET && !NET.isHost) {
    b.textContent = 'WAITING FOR THE HOST…';
    b.style.opacity = '.55'; b.style.cursor = 'default';
    box.appendChild(b);
    $('#roundOvl').classList.add('show');
    return;
  }
  b.onclick = () => {
    $('#roundOvl').classList.remove('show');
    if (NET) { netSend({ t: gameOver ? 'again' : 'next' }); return; }
    if (gameOver) { location.reload(); return; }
    if (swap) {
      const roster = G.order.map(id => {
        const p = playerById(G, id);
        if (id !== swap.out.id) return { id: p.id, name: p.name, score: p.score };
        /* If the seat that goes is yours, you keep the device and become the
           person sitting down — otherwise there would be nobody to play. */
        if (id === ME) return { id: ME, name: swap.in, score: 0 };
        return { id: 'guest' + (guestIx++), name: swap.in, score: 0 };
      });
      QUEUE.shift(); QUEUE.push(swap.out.name);
      assignColors(roster.map(p => p.id));
      G = nextRound(G, { players: roster });
      logLine('🔁 ' + swap.out.name + ' out, ' + swap.in + ' in. Waiting: ' + (QUEUE.join(', ') || 'nobody'));
    } else {
      G = nextRound(G);
    }
    logLine('— round ' + G.round + ' —');
    render(); tickBots();
  };
  box.appendChild(b);
  $('#roundOvl').classList.add('show');
}
function showScores() {
  const box = $('#pickCard');
  box.innerHTML = '<h2>' + (G.mode === 'elimination' ? 'STILL IN · ROUND ' + G.round
    : 'SCORES · PLAYING TO ' + G.target) + '</h2>';

/* ==========================================================================
   ONLINE
   --------------------------------------------------------------------------
   The server is the only place that holds a full game. We send moves and get
   back a redacted view — the same shape the solo engine produces, so almost
   all of the table code above is shared. `G` here is a shadow: real cards for
   my own hand, face-down placeholders for everybody else's, which is exactly
   what the render code needs and exactly all we are told.
   ========================================================================== */
const SERVER = (window.CG_SERVER || '').replace(/\/+$/, '');
const netMsg = t => { const e = $('#netMsg'); if (e) e.textContent = t || ''; };

function pill(cls, text) {
  const p = $('#netPill');
  p.className = 'netPill on ' + cls;
  p.textContent = text;
}

function shadowState(v) {
  const back = (pid, n) => Array.from({ length: n }, (_, i) => ({ id: 'x' + pid + i, color: 'w', kind: 'wild' }));
  const players = v.players.map(p => p.id === v.you.id
    ? { id: p.id, name: p.name, score: p.score, said: p.said, connected: p.connected, hand: v.you.hand }
    : { id: p.id, name: p.name, score: p.score, said: p.said, connected: p.connected, hand: back(p.id, p.count) });
  return {
    order: v.players.map(p => p.id),
    players,
    turn: Math.max(0, v.players.findIndex(p => p.id === v.turn)),
    dir: v.dir, color: v.color, pending: v.pending, pendingKind: v.pendingKind,
    challenge: v.challenge, drawnThisTurn: v.drawnThisTurn,
    discard: [v.top], draw: new Array(v.drawCount),
    house: v.house || {}, target: v.target, round: v.round, phase: v.phase,
    mode: v.mode, teamOf: v.teamOf, teamScores: v.teamScores,
    eliminated: v.eliminated || [], winningTeam: v.winningTeam || null,
    roundWinner: v.roundWinner, winner: v.winner, seed: 0
  };
}

function netSend(m) {
  if (!NET || !NET.ws || NET.ws.readyState !== 1) return false;
  NET.ws.send(JSON.stringify(m)); return true;
}
function netLeave() {
  if (!NET) return;
  NET.closing = true;
  try { NET.ws.close(); } catch (e) { }
  NET = null;
}

function seatKey(code) { return 'cybergrill_uno_seat_' + code; }
function loadSeat(code) { try { return JSON.parse(localStorage.getItem(seatKey(code)) || 'null'); } catch (e) { return null; } }
function saveSeat(code, seat) { try { localStorage.setItem(seatKey(code), JSON.stringify(seat)); } catch (e) { } }

function netConnect(code, name) {
  if (!SERVER) { netMsg('No server is configured for this build yet.'); return; }
  code = code.toUpperCase();
  const wsUrl = SERVER.replace(/^http/, 'ws') + '/ws/' + code;
  const seat = loadSeat(code);
  NET = NET || { code, view: null, detail: null, isHost: false, blitz: 0, deadline: 0, skew: 0, tries: 0, lobby: null };
  NET.code = code; NET.closing = false;
  pill('', 'CONNECTING…');

  let ws;
  try { ws = new WebSocket(wsUrl); } catch (e) { netMsg('Could not reach the server.'); return; }
  NET.ws = ws;

  ws.onopen = () => {
    NET.tries = 0;
    pill('live', 'ROOM ' + code);
    const hello = { t: 'hello', name };
    if (seat && seat.id) { hello.playerId = seat.id; hello.token = seat.token; }
    ws.send(JSON.stringify(hello));
    ws.send(JSON.stringify({ t: 'ping', sent: Date.now() }));
  };

  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    handleNet(m);
  };

  ws.onclose = () => {
    if (!NET || NET.closing) return;
    pill('down', 'RECONNECTING…');
    NET.tries++;
    const wait = Math.min(8000, 500 * Math.pow(1.7, NET.tries));
    setTimeout(() => { if (NET && !NET.closing) netConnect(code, name); }, wait);
  };
  ws.onerror = () => { };
}

function handleNet(m) {
  if (!NET) return;
  switch (m.t) {
    case 'pong':
      /* rough one-way offset, good enough for a turn clock */
      NET.skew = m.now - Date.now();
      break;

    case 'error':
      netMsg(m.msg);
      if (!G) { pill('down', m.msg.toUpperCase()); }
      else logLine('⚠ ' + m.msg);
      break;

    case 'joined':
      ME = m.you.id;
      NET.code = m.code;
      NET.isHost = m.hostId === m.you.id;
      saveSeat(m.code, { id: m.you.id, token: m.you.token });
      netMsg('');
      break;

    case 'lobby':
      NET.lobby = m;
      NET.isHost = m.hostId === ME;
      NET.blitz = (m.cfg && m.cfg.blitz) || 0;
      if (!m.started) { G = null; showLobby(); }
      else $('#lobbyOvl').classList.remove('show');
      break;

    case 'state': {
      const v = m.v;
      NET.view = v;
      NET.names = NET.names || {};
      v.players.forEach(p => { NET.names[p.id] = p.name; });
      NET.deadline = m.deadline || 0;
      if (m.serverNow) NET.skew = m.serverNow - Date.now();
      const first = !G;
      G = shadowState(v);
      assignColors(G.order);
      if (first) {
        $('#lobbyOvl').classList.remove('show');
        $('#setup').classList.add('gone');
        $('#table').classList.add('live');
        pill('live', 'ROOM ' + NET.code);
      }
      /* elimination ghosts, from whatever the server says is out */
      (v.eliminated || []).forEach(id => {
        if (KO.some(k => k.id === id)) return;
        const p = v.players.find(x => x.id === id);
        KO.push({ id, name: (p && p.name) || NET.names[id] || '???', round: v.round });
      });
      (m.events || []).forEach(e => { if (e.t === 'roundEnd') NET.detail = e.detail || null; });
      showEvents((m.events || []).filter(e => e.t !== 'dealt'));
      if ((m.events || []).some(e => e.t === 'dealt')) {
        $('#log').innerHTML = '';
        logLine('Cards dealt. ' + (playerById(G, G.order[G.turn]) || {}).name + ' starts.');
      }
      render();
      if (v.phase !== 'playing') showRoundEnd(); else $('#roundOvl').classList.remove('show');
      break;
    }
  }
}

/* --------------------------------------------------------------- the lobby */
function showLobby() {
  const L = NET && NET.lobby;
  if (!L) return;
  const box = $('#lobbyCard');
  const mine = MODE_UI.find(x => x[0] === (L.cfg.mode || 'classic')) || MODE_UI[0];
  const on = HOUSE_UI.filter(([k]) => L.cfg.house && L.cfg.house[k]).map(([, n]) => n);

  box.innerHTML =
    '<h2>ROOM CODE</h2>' +
    '<div class="codeBig">' + esc(L.code) + '</div>' +
    '<div class="codeHint">READ IT OUT — THEY TYPE IT IN AND JOIN</div>' +
    '<div style="font-size:11px;font-weight:800;color:var(--dim);letter-spacing:1px">' +
      mine[2] + ' ' + mine[3] + ' · TO ' + L.cfg.target +
      (L.cfg.blitz ? ' · ' + L.cfg.blitz + 's CLOCK' : '') +
      (on.length ? '<br>' + esc(on.join(' · ')) : '<br>OFFICIAL RULES') +
    '</div>';

  const list = el('div', 'lobList');
  L.players.forEach(p => {
    list.appendChild(el('div', null,
      '<span class="dot' + (p.connected ? '' : ' off') + '"></span>' +
      '<span>' + esc(p.name) + (p.id === ME ? ' (you)' : '') + '</span>' +
      (p.id === L.hostId ? '<span class="tagH">HOST</span>' : p.bot ? '<span class="tagB">BOT</span>' : '')));
  });
  box.appendChild(list);

  if (NET.isHost) {
    const bots = el('button', 'act', '🤖 ADD A BOT');
    bots.onclick = () => { netSend({ t: 'addBot' }); SFX.tick(); };
    box.appendChild(bots);
    const go = el('button', 'go', L.players.length < 2 ? 'WAITING FOR ONE MORE…' : 'DEAL ▶');
    if (L.players.length >= 2) go.onclick = () => { ac(); netSend({ t: 'start' }); };
    else { go.style.opacity = '.5'; go.style.cursor = 'default'; }
    box.appendChild(go);
  } else {
    box.appendChild(el('div', null,
      '<div style="font-size:12px;font-weight:800;color:var(--dim);margin-top:6px">' +
      'Waiting for ' + esc((L.players.find(p => p.id === L.hostId) || {}).name || 'the host') + ' to deal…</div>'));
  }

  const leave = el('button', 'act', 'LEAVE');
  leave.style.marginTop = '10px';
  leave.onclick = () => { netLeave(); location.reload(); };
  box.appendChild(leave);
  $('#lobbyOvl').classList.add('show');
}

/* ------------------------------------------------------------ setup wiring */
let online = false;
function setTable(net) {
  online = net;
  $('#tabSolo').classList.toggle('on', !net);
  $('#tabNet').classList.toggle('on', net);
  $('#netBox').classList.toggle('on', net);
  document.querySelectorAll('.soloOnly').forEach(e => e.classList.toggle('hide', net));
  $('#startBtn').style.display = net ? 'none' : '';
  if (net && !SERVER) netMsg('This build has no server address yet — set uno_server in config.yml.');
  else netMsg('');
}
$('#tabSolo').onclick = () => { setTable(false); SFX.tick(); };
$('#tabNet').onclick = () => { setTable(true); SFX.tick(); };
setTable(false);

function myName() {
  const n = ($('#myName').value || 'YOU').trim().slice(0, 14).toUpperCase();
  try { localStorage.setItem('cybergrill_uno_name', n); } catch (e) { }
  return n;
}

$('#createBtn').onclick = async () => {
  if (!SERVER) return netMsg('No server address is configured for this build.');
  ac(); netMsg('Making a room…');
  $('#createBtn').disabled = true;
  try {
    const r = await fetch(SERVER + '/api/room', { method: 'POST' });
    if (!r.ok) throw new Error('the server said no (' + r.status + ')');
    const { code } = await r.json();
    KO = []; seatColor = {}; nextSeatIx = 0;
    netConnect(code, myName());
    /* the host's settings travel with the room */
    const send = () => {
      if (!netSend({ t: 'cfg', cfg: { mode: cfg.mode, target: cfg.target, blitz: cfg.blitz, house: cfg.house } }))
        setTimeout(send, 250);
    };
    setTimeout(send, 400);
  } catch (e) {
    netMsg(e.message || 'could not reach the server');
  } finally { $('#createBtn').disabled = false; }
};

$('#joinBtn').onclick = async () => {
  const code = ($('#joinCode').value || '').trim().toUpperCase();
  if (code.length < 3) return netMsg('Type the four-letter code first.');
  if (!SERVER) return netMsg('No server address is configured for this build.');
  ac(); netMsg('Knocking…');
  KO = []; seatColor = {}; nextSeatIx = 0;
  netConnect(code, myName());
};
$('#joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });

/* a ?room=CODE link drops you straight into the lobby */
{
  const q = new URLSearchParams(location.search).get('room');
  if (q) { setTable(true); $('#joinCode').value = q.toUpperCase(); }
}

document.querySelectorAll('.ovl').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o && ['roundOvl','colorOvl','lobbyOvl'].indexOf(o.id) === -1) o.classList.remove('show'); });
});
addEventListener('keydown', e => {
  if (!G || G.phase !== 'playing') return;
  const k = e.key.toLowerCase();
  const v = viewFor(G, ME);
  if (k === 'd' && v.moves.some(m => m.type === 'draw')) doMove({ type: 'draw' });
  if (k === 'u' && v.moves.some(m => m.type === 'sayUno')) doMove({ type: 'sayUno' });
});
</script>
