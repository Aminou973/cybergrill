<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>CYBERGRILL RONDA</title>
<style>
/* ==========================================================================
   TABLE — the furniture every CyberGrill game sits on.

   Colours, the setup panel, the top bar, buttons, overlays, the log, the
   online chrome and the info panel. Inlined into each table page at build time
   (look for the TABLECSS markers), so a game page only has to describe the
   thing that makes it different: a hand of cards, or a board.
   ========================================================================== */
:root{
  --bg:#05060f;--panel:rgba(16,20,44,.72);--line:rgba(120,140,255,.18);
  --txt:#e8ecff;--dim:#8b93c4;--cyan:#22e6ff;--pink:#ff2fb9;--lime:#9cff2e;
  --gold:#ffc93c;--violet:#a55bff;--orange:#ff8a2b;
  --cr:#ff4d5e;--cg:#3ddc6d;--cb:#3d8bff;--cy:#ffd23d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 12% -10%,rgba(34,230,255,.16),transparent 60%),
             radial-gradient(1000px 700px at 92% 8%,rgba(255,47,185,.14),transparent 60%),
             radial-gradient(900px 900px at 50% 120%,rgba(165,91,255,.14),transparent 60%),var(--bg);
  color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:90;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.5) 100%)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------------- setup ---------------- */
#setup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;padding:20px}
#setup.gone{display:none}
.sBox{width:min(94vw,640px);background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:24px;backdrop-filter:blur(10px)}
h1{font-size:min(9vw,44px);font-weight:900;letter-spacing:6px;text-align:center;line-height:1;
  background:linear-gradient(90deg,var(--cyan),var(--pink) 55%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,230,255,.45))}
.sub{text-align:center;font-size:10px;letter-spacing:6px;color:var(--dim);font-weight:800;margin:8px 0 22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:9px;letter-spacing:2.5px;color:var(--dim);font-weight:800;margin-bottom:6px}
.fld input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);
  color:#fff;font-family:inherit;font-weight:800;font-size:16px;letter-spacing:1px}
.fld input:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 20px -6px var(--cyan)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.pill{flex:1;min-width:64px;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);cursor:pointer;text-align:center;font-weight:900;font-size:13px;transition:.15s}
.pill:hover{transform:translateY(-2px)}
.pill.on{background:linear-gradient(90deg,var(--cyan),#4df3d0);color:#04121a;border-color:transparent}
.hr2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);margin-bottom:6px;cursor:pointer}
.hr2 .sw{width:36px;height:20px;border-radius:11px;background:rgba(255,255,255,.13);position:relative;flex:0 0 auto;transition:.2s}
.hr2 .sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.hr2.on .sw{background:var(--violet)}
.hr2.on .sw::after{left:19px}
.hr2 b{font-size:11.5px;font-weight:900;letter-spacing:.5px}
.hr2 span{font-size:10px;color:var(--dim);font-weight:700}
.go{width:100%;margin-top:16px;padding:17px;border-radius:15px;border:2px solid var(--lime);cursor:pointer;
  background:linear-gradient(90deg,rgba(156,255,46,.18),rgba(37,230,160,.18));color:var(--lime);
  font-family:inherit;font-weight:900;letter-spacing:5px;font-size:15px;transition:.18s}
.go:hover{background:var(--lime);color:#04120a;transform:scale(1.02)}

/* ---------------- table ---------------- */
#table{position:fixed;inset:0;display:none;flex-direction:column}
#table.live{display:flex}
.topline{display:flex;align-items:center;gap:9px;padding:9px 13px;flex:0 0 auto;flex-wrap:wrap}
.logo{font-size:17px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--dim);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.chip i{font-style:normal;font-size:13px;line-height:1}
.chip:hover{color:#fff;border-color:var(--cyan)}
.spacer{flex:1}
.dirBadge{font-size:15px;filter:drop-shadow(0 0 8px var(--gold))}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);
  cursor:pointer;text-align:center;font-size:12px;font-weight:900;letter-spacing:1px;transition:.18s}
.tab.on{border-color:var(--gold);background:rgba(255,217,60,.12);color:var(--gold);box-shadow:0 0 22px -8px var(--gold)}
.netBox{display:none} .netBox.on{display:block}
.soloOnly.hide{display:none}
.codeBig{font-size:min(17vw,64px);font-weight:900;letter-spacing:10px;text-align:center;margin:6px 0 2px;
  background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.codeHint{text-align:center;font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;margin-bottom:14px}
.lobList{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left}
.lobList div{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;background:rgba(255,255,255,.05);font-size:13px;font-weight:800}
.lobList .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.lobList .dot.off{background:#666;box-shadow:none}
.lobList .tagH{margin-left:auto;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:var(--gold);color:#120a02}
.lobList .tagB{margin-left:auto;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.12);color:var(--dim)}
.netPill{position:fixed;left:12px;bottom:12px;z-index:80;font-size:10px;font-weight:900;letter-spacing:1.5px;
  padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--dim);display:none}
.netPill.on{display:block}
.netPill.live{color:var(--lime);border-color:rgba(156,255,46,.4)}
.netPill.down{color:#ff4d5e;border-color:rgba(255,77,94,.4);animation:critPulse 1s ease-in-out infinite}

.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.act{padding:13px 20px;border-radius:13px;border:0;cursor:pointer;font-family:inherit;font-weight:900;
  letter-spacing:2px;font-size:12px;transition:.16s;background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--line)}
.act:hover{transform:translateY(-2px)}
.act.draw{background:linear-gradient(90deg,var(--cyan),#4df3d0);color:#04121a;border-color:transparent}
.act.uno{background:linear-gradient(90deg,var(--gold),var(--orange));color:#120a02;border-color:transparent;
  animation:unoPulse 1s ease-in-out infinite}
@keyframes unoPulse{50%{box-shadow:0 0 26px -3px var(--gold)}}
.act.warn{background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff;border-color:transparent}
.act.good{background:linear-gradient(90deg,var(--lime),#25e6a0);color:#04120a;border-color:transparent}

.log{position:fixed;left:12px;bottom:12px;width:min(38vw,300px);max-height:26vh;overflow:hidden;
  display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none;z-index:30}
.log div{font-size:11px;font-weight:700;color:var(--dim);background:rgba(10,14,32,.75);
  padding:5px 9px;border-radius:8px;border-left:2px solid var(--cyan);animation:logIn .3s}
@keyframes logIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes gpop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

/* overlays */
.ovl{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(3,4,12,.82);backdrop-filter:blur(8px)}
.ovl.show{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.oCard{width:min(94vw,460px);background:rgba(12,16,38,.98);border:1px solid var(--line);border-radius:20px;
  padding:26px;text-align:center;animation:pop .4s cubic-bezier(.16,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.oCard h2{font-size:13px;letter-spacing:4px;color:var(--dim);font-weight:800;margin-bottom:18px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sw2{padding:26px;border-radius:15px;cursor:pointer;font-weight:900;font-size:13px;letter-spacing:2px;
  color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);transition:.15s;border:2px solid rgba(255,255,255,.25)}
.sw2:hover{transform:scale(1.06)}
.bigName{font-size:min(11vw,54px);font-weight:900;letter-spacing:2px;line-height:1;margin:10px 0;
  background:linear-gradient(90deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.scoreList{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.scoreList div{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px}
.scoreList div span:last-child{margin-left:auto;font-weight:900;color:var(--gold)}

/* ---------------- the intel panel ---------------- */
.intel{position:fixed;right:0;top:46px;bottom:0;width:262px;z-index:44;overflow-y:auto;padding:12px 12px 24px;
  background:#080b1a;backdrop-filter:blur(16px);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);scrollbar-width:thin}
body.intelOn .intel{transform:none}
body.intelOn #table{margin-right:262px}
.iSec{margin-bottom:14px}
.iSec h4{font-size:9px;letter-spacing:2.4px;color:var(--dim);font-weight:800;margin-bottom:7px}
.iRow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;padding:7px 9px;border-radius:9px;
  background:rgba(255,255,255,.045);margin-bottom:5px}
.iRow .r{margin-left:auto;color:var(--gold);font-weight:900}
.iRow.me{border:1px solid rgba(34,230,255,.35)}
.iRow.warn{border:1px solid rgba(255,201,60,.5);background:rgba(255,201,60,.09)}
.iBars{display:flex;gap:4px;align-items:flex-end;height:52px;padding:0 2px;margin:18px 0 6px}
.iBars div{flex:1;border-radius:5px 5px 2px 2px;position:relative;min-height:3px;transition:height .3s}
.iBars div span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--txt)}
.iBig{font-size:23px;font-weight:900;letter-spacing:-.5px}
.iSub{font-size:10px;color:var(--dim);font-weight:700;line-height:1.55}
.iFlag{font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.iMeter{height:6px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px}
.iMeter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--lime))}

/* what a card does, on hover or a long press */
.tip{position:fixed;z-index:95;max-width:250px;padding:10px 12px;border-radius:12px;pointer-events:none;
  background:rgba(8,11,26,.97);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.7);
  font-size:11px;font-weight:700;color:var(--txt);line-height:1.55;opacity:0;transform:translateY(6px);
  transition:opacity .14s,transform .14s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:12px;letter-spacing:1.4px;margin-bottom:3px;color:var(--gold)}
.tip em{display:block;font-style:normal;color:var(--dim);font-size:10px;margin-top:5px}

/* a card flying from a hand to the discard */
.flyer{position:fixed;z-index:75;pointer-events:none;border-radius:10px;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(0,0,0,.6);display:grid;place-items:center;font-weight:900;color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.4)}


/* the game switcher, one chip instead of one per game */
.gameGrid{display:grid;gap:9px;margin:10px 0 4px}
.gameGrid a{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);text-decoration:none;color:var(--txt);
  transition:.16s;text-align:left}
.gameGrid a:hover{border-color:var(--cyan);background:rgba(34,230,255,.1);transform:translateY(-2px)}
.gameGrid a.here{border-color:var(--gold);background:rgba(255,201,60,.1)}
.gameGrid i{font-style:normal;font-size:26px;line-height:1}
.gameGrid b{display:block;font-size:13px;font-weight:900;letter-spacing:1.5px}
.gameGrid span{display:block;font-size:10px;color:var(--dim);font-weight:700;line-height:1.5;margin-top:2px}


/* ---------------- the Spanish deck ---------------- */
.cf{display:block;width:100%;height:100%;border-radius:inherit}
.rcard{width:74px;height:111px;border-radius:9px;position:relative;flex:0 0 auto;
  box-shadow:0 5px 15px rgba(0,0,0,.55);transition:transform .18s cubic-bezier(.2,.9,.3,1.2),box-shadow .18s,filter .18s}
.rcard.sm{width:58px;height:87px;border-radius:7px}
body.th-neon .rcard{box-shadow:0 5px 18px rgba(0,0,0,.6),0 0 22px -8px var(--glowc,transparent)}

/* the four face-up cards */
.mesa{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;
  padding:16px;border-radius:22px;min-height:130px;min-width:min(80vw,520px);
  background:radial-gradient(ellipse at 50% 40%,rgba(34,230,255,.10),rgba(10,14,32,.5) 70%);
  border:2px solid rgba(120,140,255,.22);box-shadow:inset 0 0 60px -18px var(--cyan)}
.mesa .rcard{cursor:default}
.mesa .rcard.willTake{transform:translateY(-12px) scale(1.06);
  box-shadow:0 14px 28px rgba(0,0,0,.6),0 0 0 3px var(--lime),0 0 26px -2px var(--lime)}
.mesa .rcard.taking{animation:takeAway .45s cubic-bezier(.4,0,.6,1) forwards}
@keyframes takeAway{to{transform:translateY(120px) scale(.5) rotate(12deg);opacity:0}}
.mesaEmpty{font-size:11px;letter-spacing:3px;color:var(--dim);font-weight:900}

/* my three */
.myHand{display:flex;gap:12px;justify-content:center;align-items:flex-end;min-height:124px;padding:8px 10px 4px}
.myHand .rcard{cursor:pointer}
.myHand .rcard:hover{transform:translateY(-16px) scale(1.06);box-shadow:0 18px 32px rgba(0,0,0,.6);z-index:5}
.myHand .rcard.dim{opacity:.55;cursor:default}
.myHand .rcard.dim:hover{transform:none}
.myHand .rcard.willCapture:hover{box-shadow:0 18px 32px rgba(0,0,0,.6),0 0 0 3px var(--lime)}

/* the seats round the table */
.rSeat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:6;transition:.2s}
.rSeat .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-weight:900;font-size:14px;color:#04060f;position:relative}
.rSeat.turn .av{box-shadow:0 0 0 3px var(--lime),0 0 28px -2px var(--lime);animation:pulseSeat 1.4s ease-in-out infinite}
@keyframes pulseSeat{50%{box-shadow:0 0 0 5px var(--lime),0 0 38px 0 var(--lime)}}
.rSeat .nm{font-size:11px;font-weight:900;letter-spacing:.4px;white-space:nowrap}
.rSeat .sub{font-size:9.5px;color:var(--dim);font-weight:800;letter-spacing:1px}
.rSeat.gone .nm::after{content:' 📴'}
.rSeat.mate .av{outline:2px dashed rgba(156,255,46,.65);outline-offset:3px}
.rSeat.top{left:50%;top:2%;transform:translateX(-50%)}
.rSeat.left{left:3%;top:50%;transform:translateY(-50%)}
.rSeat.right{right:3%;top:50%;transform:translateY(-50%)}
.backs{display:flex;height:22px}
.backs i{display:block;width:15px;height:22px;border-radius:3px;margin-left:-8px;
  background:linear-gradient(140deg,#5a2130,#2a1018);border:1px solid rgba(255,255,255,.35)}
.backs i:first-child{margin-left:0}
/* the captured pile, face down */
.pileStack{position:relative;width:34px;height:26px}
.pileStack i{position:absolute;left:0;top:0;width:26px;height:20px;border-radius:3px;
  background:linear-gradient(140deg,#3a2a18,#1a1208);border:1px solid rgba(255,255,255,.22)}
.pileNum{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:1px}

/* the scoreboard */
.teamBar{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:900;letter-spacing:1px}
.teamBar span{padding:5px 10px;border-radius:9px}
.tA{background:rgba(34,230,255,.18);color:var(--cyan)}
.tB{background:rgba(255,138,43,.18);color:var(--orange)}

/* what just happened, said loudly in the middle */
.callOut{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:79;pointer-events:none;
  text-align:center;animation:callIn 1.5s cubic-bezier(.2,1.5,.4,1) forwards}
.callOut b{display:block;font-size:min(13vw,74px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--gold),#fff,var(--orange));-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 0 26px rgba(255,201,60,.7))}
.callOut span{display:block;font-size:13px;font-weight:900;letter-spacing:4px;color:var(--txt);margin-top:2px}
@keyframes callIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  76%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}

.chainTag{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:1.5px;
  padding:5px 10px;border-radius:9px;background:rgba(255,201,60,.16);color:var(--gold)}

.felt{flex:1;position:relative;min-height:0;max-height:min(58vh,540px);display:grid;place-items:center;padding:4px}
#table.live{justify-content:center}

@media(max-width:860px){
  .rcard{width:58px;height:87px}
  .rcard.sm{width:46px;height:69px}
  .mesa{gap:7px;padding:11px;min-width:min(94vw,420px);min-height:104px}
  .myHand{gap:9px;min-height:98px}
  .rSeat .av{width:38px;height:38px;font-size:12px}
  .topline{padding:7px 9px;gap:6px}
  .logo{font-size:14px;letter-spacing:1px}
}
@media(max-width:700px){
  .logo{display:none}
  .chip .cl{display:none}
  /* with three games to hop between there are seven of these — they have to
     shrink to icons AND tighten up, or the last one falls off a phone */
  .chip{padding:7px 8px}
  .chip i{font-size:15px}
  .topline{gap:4px;padding:7px 6px}
  .topline{flex-wrap:nowrap;overflow:hidden}
  .log{left:8px;right:8px;width:auto;top:52px;bottom:auto;max-height:none;flex-direction:column}
  .log div{font-size:10px;padding:4px 8px;opacity:.85}
  .tip{max-width:min(78vw,270px);font-size:11px}
  .rSeat.left{left:1%} .rSeat.right{right:1%}
  .teamBar{font-size:9px;gap:4px}
  .teamBar span{padding:3px 6px}
  .teamBar span:last-child{display:none}
  .chainTag{display:none!important}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<svg id="cgDefs" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
  <filter id="cgGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs></svg>

<div id="setup"><div class="sBox">
  <h1>CYBERGRILL RONDA</h1>
  <div class="sub">4 0 &nbsp; C A R D S</div>

  <div class="tabs">
    <div class="tab on" id="tabSolo">🤖 SOLO VS BOTS</div>
    <div class="tab" id="tabNet">🌍 ONLINE</div>
  </div>

  <div class="fld"><label>YOUR NAME</label><input id="myName" maxlength="14" placeholder="AMIN" autocomplete="off"></div>

  <div class="netBox" id="netBox">
    <div class="fld"><label>START A TABLE, OR JOIN ONE</label>

<script type="module">
/* ---- ronda engine, inlined at build time ---- */
/* ==========================================================================
   RONDA — and Makla, its café cousin.
   --------------------------------------------------------------------------
   Built from cybergrill/ronda-rules.md, which is Amin's own account of how his
   table plays it. That file is the source of truth: corrections go there
   first, and then here. Where the written rules did not cover a case I have
   said so in a comment rather than quietly inventing something — look for
   "EXTRAPOLATED" and check those against a real game.

   The one thing to hold in your head: the ranks run

        1 2 3 4 5 6 7 10 11 12

   with no 8 and no 9, so **7 and 10 are neighbours**. Sequences cross that
   join. Suits exist on the cards and mean nothing to the rules.
   ========================================================================== */

export const META = {
  id: 'ronda',
  name: 'Ronda',
  icon: '🃏',
  blurb: 'The Algerian card game. Match a rank, sweep the run behind it, count to 41.',
  min: 2,
  max: 4,
  exactCounts: [2, 4],          /* two head to head, or four in two pairs */
  evenOnly: true,
  path: 'ronda/'
};

/* the deck, in the only order that matters */
export const RANKS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
export const SUITS = ['o', 'c', 'e', 'b'];        /* oros, copas, espadas, bastos */
export const SUIT_NAME = { o: 'OROS', c: 'COPAS', e: 'ESPADAS', b: 'BASTOS' };
export const RANK_NAME = { 10: 'SOTA', 11: 'CABALLO', 12: 'REY' };
export const TARGET = 41;
export const BREAK_EVEN = 20;   /* forty cards, so twenty is nobody's */

export const ord = r => RANKS.indexOf(r);
export const nextRank = r => { const i = ord(r); return i >= 0 && i < RANKS.length - 1 ? RANKS[i + 1] : null; };

export const VARIANTS = ['ronda', 'makla'];
export const DEFAULT_HOUSE = {
  variant: 'ronda',
  darbaTalk: true,   /* Makla only: still call the darba, just for the insult */
  missaLastHand: false
};

export const SCORES = { ronda: 1, tringa: 5, darba: 1, khamsa: 5, ashra: 10, missa: 1 };

export function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clone = s => JSON.parse(JSON.stringify(s));

export function buildDeck() {
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push({ id: s + r, rank: r, suit: s });
  return d;
}
function shuffle(cards, rnd) {
  const a = cards.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

export function playerById(state, id) { return state.players.find(p => p.id === id); }
export function currentPlayer(state) { return playerById(state, state.order[state.turn]); }
export function teamOf(state, id) { const p = playerById(state, id); return p ? p.team : null; }
export function teamMates(state, team) { return state.players.filter(p => p.team === team); }

/* ==========================================================================
   the deal
   ========================================================================== */

/* The clean table rule. The four face-up cards must not contain a pair, and
   must not be a four-card run. Whichever it is, the offending card goes back
   into the deck and a fresh one comes out. Repeat until the table is dead. */
export function cleanTable(deck, table, events) {
  let guard = 0;
  while (guard++ < 60) {
    /* a pair — the second one of the two goes back */
    let cut = -1;
    outer:
    for (let i = 0; i < table.length; i++) {
      for (let j = i + 1; j < table.length; j++) {
        if (table[i].rank === table[j].rank) { cut = j; break outer; }
      }
    }
    /* otherwise, four in an unbroken run — the last one of the run goes back */
    if (cut < 0 && table.length === 4) {
      const byOrd = table.map((c, i) => ({ i, o: ord(c.rank) })).sort((a, b) => a.o - b.o);
      let run = true;
      for (let k = 1; k < byOrd.length; k++) if (byOrd[k].o !== byOrd[k - 1].o + 1) { run = false; break; }
      if (run) cut = byOrd[byOrd.length - 1].i;
    }
    if (cut < 0) return;
    if (!deck.length) return;
    const buried = table[cut];
    table[cut] = deck.shift();
    deck.push(buried);                       /* back into the deck, at the bottom */
    if (events) events.push({ t: 'bury', card: buried, drew: table[cut] });
  }
}

export function createGame(opts = {}) {
  const list = (opts.players || []).slice(0, META.max);
  if (list.length !== 2 && list.length !== 4) throw new Error('ronda is played two-handed or four in two pairs');
  const house = { ...DEFAULT_HOUSE, ...(opts.house || {}) };
  if (!VARIANTS.includes(house.variant)) house.variant = 'ronda';
  const seed = (opts.seed === undefined ? 1 : opts.seed) >>> 0;
  const rnd = mulberry32(seed);

  /* seats alternate, so in a four-hander your partner is opposite you */
  const players = list.map((p, i) => ({
    id: p.id, name: p.name, seat: i,
    team: list.length === 4 ? (i % 2 === 0 ? 'A' : 'B') : (i === 0 ? 'A' : 'B'),
    hand: [], pile: [], score: p.score || 0, connected: true
  }));

  const s = {
    game: 'ronda',
    variant: house.variant,
    players,
    order: players.map(p => p.id),
    /* Play starts to the dealer's right and goes anti-clockwise. We put the
       seats in that order to begin with, so "the next seat" is simply +1 and
       the board can draw them the way they sit. */
    turn: 0,
    dir: 1,
    dealer: players[players.length - 1].id,
    deck: shuffle(buildDeck(), rnd),
    table: [],
    pending: [],                 /* what the last capture took, for the animation */
    phase: 'playing',
    house,
    seed,
    lastCapture: null,           /* who sweeps at the end — Bawesh */
    lastPlay: null,              /* {who, card, captured} — a darba needs this */
    chain: null,                 /* {rank, team, stage} — darba, then b'khamsa, then b'ashra */
    hand: 0,                     /* which set of three we are on */
    round: opts.round || 1,
    target: house.variant === 'makla' ? 0 : (opts.target || TARGET),
    teamScores: { A: 0, B: 0 },
    calls: [],                   /* the announcements of the current hand */
    roundWinner: null,
    winner: null
  };
  /* carry the match score in on the team, not the player */
  players.forEach(p => { s.teamScores[p.team] = Math.max(s.teamScores[p.team], p.score || 0); });

  const events = [];
  s.table = s.deck.splice(0, 4);
  cleanTable(s.deck, s.table, events);
  dealHands(s, events);
  s.openingEvents = events;
  return s;
}

function dealHands(s, events) {
  s.hand++;
  for (const p of s.players) p.hand = s.deck.splice(0, 3);
  events.push({ t: 'deal', hand: s.hand, left: s.deck.length });
  s.calls = [];
  if (s.variant === 'ronda') announce(s, events);
}

/* ==========================================================================
   Ronda and Tringa, called the moment a hand is dealt
   --------------------------------------------------------------------------
   The rules cover: a pair is 1, three of a kind is 5, opposing Rondas mean the
   higher pair takes both points, equal rank splits, and a Tringa always beats
   a Ronda.

   EXTRAPOLATED, because the rules do not say and it cannot come up often:
     * two Tringas of different ranks — the higher scores its 5, the other
       nothing. It does not double the way Rondas do, because "takes both
       points" was said of Rondas specifically.
     * three or more Rondas — the pot is one point per caller and the highest
       rank takes the lot, which is the same rule stretched.
   ========================================================================== */
function announce(s, events) {
  const calls = [];
  for (const p of s.players) {
    const byRank = {};
    p.hand.forEach(c => { byRank[c.rank] = (byRank[c.rank] || 0) + 1; });
    let best = null;
    for (const r of Object.keys(byRank)) {
      const n = byRank[r], rank = +r;
      if (n >= 3) { best = { kind: 'tringa', rank }; break; }
      if (n === 2 && (!best || ord(rank) > ord(best.rank))) best = { kind: 'ronda', rank };
    }
    if (best) calls.push({ who: p.id, team: p.team, ...best });
  }
  s.calls = calls;
  if (!calls.length) return;

  const tringas = calls.filter(c => c.kind === 'tringa');
  if (tringas.length) {
    const top = tringas.slice().sort((a, b) => ord(b.rank) - ord(a.rank))[0];
    s.teamScores[top.team] += SCORES.tringa;
    events.push({ t: 'call', kind: 'tringa', who: top.who, team: top.team, rank: top.rank, points: SCORES.tringa });
    calls.filter(c => c !== top).forEach(c =>
      events.push({ t: 'call', kind: c.kind, who: c.who, team: c.team, rank: c.rank, points: 0, beaten: true }));
    return;
  }

  const pot = calls.length;                       /* one point per caller */
  const topOrd = Math.max(...calls.map(c => ord(c.rank)));
  const winners = calls.filter(c => ord(c.rank) === topOrd);
  const each = Math.floor(pot / winners.length);
  calls.forEach(c => {
    const won = winners.indexOf(c) !== -1;
    const pts = won ? each : 0;
    if (pts) s.teamScores[c.team] += pts;
    events.push({ t: 'call', kind: 'ronda', who: c.who, team: c.team, rank: c.rank, points: pts, beaten: !won });
  });
}

/* ==========================================================================
   what you may do
   ========================================================================== */
export function legalMoves(state, playerId) {
  if (state.phase !== 'playing') return [];
  if (state.order[state.turn] !== playerId) return [];
  const me = playerById(state, playerId);
  if (!me) return [];
  /* You play exactly one card. There is never a choice about whether to
     capture — if the rank is on the table, it comes to you. */
  return me.hand.map(c => ({ type: 'play', cardId: c.id }));
}

/* what a card of this rank would take off this table */
export function captureWith(table, rank) {
  const i = table.findIndex(c => c.rank === rank);
  if (i < 0) return [];
  const taken = [table[i]];
  let r = rank;
  for (; ;) {
    r = nextRank(r);
    if (r === null) break;
    const j = table.findIndex(c => c.rank === r && taken.indexOf(c) === -1);
    if (j < 0) break;
    taken.push(table[j]);
  }
  return taken;
}

/* ==========================================================================
   playing a card
   ========================================================================== */
export function applyMove(state, playerId, move) {
  const s = clone(state);
  const events = [];
  if (s.phase !== 'playing') throw new Error('the round is over');
  if (s.order[s.turn] !== playerId) throw new Error('not your turn');
  if (!move || move.type !== 'play') throw new Error('play a card');
  const me = playerById(s, playerId);
  const idx = me.hand.findIndex(c => c.id === move.cardId);
  if (idx < 0) throw new Error('that card is not in your hand');
  const card = me.hand.splice(idx, 1)[0];

  const taken = captureWith(s.table, card.rank);
  const beforeCount = s.table.length;
  let justDarba = false;

  if (taken.length) {
    s.table = s.table.filter(c => taken.indexOf(c) === -1);
    me.pile.push(card, ...taken);
    s.lastCapture = me.id;
    s.pending = [card, ...taken];
    events.push({ t: 'capture', who: me.id, card, taken, run: taken.length > 1 });

    /* Darba — the player right before you left this exact card, and you have
       just taken it back with the same rank. */
    const lp = s.lastPlay;
    const darba = lp && !lp.captured && lp.card.rank === card.rank &&
      taken.some(c => c.id === lp.card.id) && teamOf(s, lp.who) !== me.team;
    if (darba) {
      justDarba = true;
      const pts = s.variant === 'ronda' ? SCORES.darba : 0;
      if (pts) s.teamScores[me.team] += pts;
      s.chain = { rank: card.rank, team: me.team, stage: 1 };
      events.push({ t: 'darba', who: me.id, team: me.team, rank: card.rank, points: pts });
    }

    /* Missa — the capture cleared the table. Not on the last hand, when the
       sweep would have taken it anyway. */
    if (s.table.length === 0 && beforeCount > 0 && s.variant === 'ronda') {
      /* "the last hand of the round" is the last *deal*, not the last play:
         once the deck is empty no more threes are coming, and whatever is left
         on the table goes to the sweep anyway. */
      const lastHand = s.deck.length === 0;
      if (!lastHand || s.house.missaLastHand) {
        s.teamScores[me.team] += SCORES.missa;
        events.push({ t: 'missa', who: me.id, team: me.team, points: SCORES.missa });
      } else {
        events.push({ t: 'missa', who: me.id, team: me.team, points: 0, lastHand: true });
      }
    }
  } else {
    s.table.push(card);
    s.pending = [];
    events.push({ t: 'drop', who: me.id, card });
  }

  /* the chain that runs on from a darba: the third card of that rank, then the
     fourth. It is the darba team's chain; if the other side plays that rank
     first, it is broken. */
  /* The chain that runs on from a darba, and it is one side's chain: they took
     the second card of the rank, they drop the third, they play the fourth.
     If the other side gets in first the chain is dead — though taking a
     just-dropped card back is a darba of their own, which is handled above and
     starts a new chain rather than continuing this one.

     EXTRAPOLATED: the rules say the b'ashra is "the fourth card of that rank
     straight after a b'khamsa" without saying who plays it. Requiring the same
     team is what makes the b'khamsa a gamble worth taking, so that is what
     this does. Worth checking at a real table. */
  if (s.chain && card.rank === s.chain.rank && !justDarba) {
    if (me.team !== s.chain.team) {
      events.push({ t: 'chainBroken', rank: s.chain.rank, by: me.id });
      s.chain = null;
    } else if (s.chain.stage === 1) {
      const pts = s.variant === 'ronda' ? SCORES.khamsa : 0;
      s.teamScores[me.team] += pts;
      events.push({ t: 'khamsa', who: me.id, team: me.team, rank: card.rank, points: pts });
      s.chain.stage = 2;
    } else {
      const pts = s.variant === 'ronda' ? SCORES.ashra : 0;
      s.teamScores[me.team] += pts;
      events.push({ t: 'ashra', who: me.id, team: me.team, rank: card.rank, points: pts });
      s.chain = null;
    }
  }

  s.lastPlay = { who: me.id, card, captured: taken.length > 0 };

  /* everybody out of cards? three more each, and nothing new on the table */
  if (s.players.every(p => p.hand.length === 0)) {
    if (s.deck.length >= s.players.length * 3) {
      dealHands(s, events);
    } else {
      endRound(s, events);
      return { state: s, events };
    }
  }

  s.turn = (s.turn + 1) % s.order.length;
  return { state: s, events };
}

/* ==========================================================================
   the end of a round
   ========================================================================== */
function endRound(s, events) {
  /* Bawesh — whoever captured last sweeps what is left */
  if (s.table.length) {
    const who = s.lastCapture || s.order[s.turn];
    const p = playerById(s, who);
    p.pile.push(...s.table);
    events.push({ t: 'bawesh', who, cards: s.table.slice() });
    s.table = [];
  }

  const counts = { A: 0, B: 0 };
  s.players.forEach(p => { counts[p.team] += p.pile.length; });

  const gained = { A: Math.max(0, counts.A - BREAK_EVEN), B: Math.max(0, counts.B - BREAK_EVEN) };
  if (s.variant === 'ronda') {
    s.teamScores.A += gained.A;
    s.teamScores.B += gained.B;
  }
  events.push({ t: 'count', counts, gained, teamScores: { ...s.teamScores } });

  /* mirror the team score onto each player so the shared table code can show it */
  s.players.forEach(p => { p.score = s.teamScores[p.team]; });

  s.phase = 'roundEnd';
  s.roundWinner = counts.A === counts.B ? null : (counts.A > counts.B ? 'A' : 'B');

  if (s.variant === 'makla') {
    /* one hand, count, done — no running total */
    s.winner = s.roundWinner;
    s.phase = 'gameEnd';
    events.push({ t: 'gameEnd', team: s.winner, counts, draw: s.roundWinner === null });
    return;
  }
  const top = s.teamScores.A >= s.teamScores.B ? 'A' : 'B';
  if (s.teamScores[top] >= s.target) {
    s.winner = top;
    s.phase = 'gameEnd';
    events.push({ t: 'gameEnd', team: top, score: s.teamScores[top] });
  }
}

export function nextRound(state, opts = {}) {
  const roster = (opts.players || state.players).map(p => ({ id: p.id, name: p.name, score: p.score || 0 }));
  const s = createGame({
    players: roster,
    seed: (state.seed * 1103515245 + 12345) >>> 0,
    house: state.house,
    target: state.target,
    round: state.round + 1
  });
  s.teamScores = { ...state.teamScores };
  s.players.forEach(p => { p.score = s.teamScores[p.team]; });
  /* the deal passes on */
  const d = state.order.indexOf(state.dealer);
  s.dealer = s.order[(d + 1) % s.order.length];
  return s;
}

/* ==========================================================================
   what a player is allowed to see
   --------------------------------------------------------------------------
   Your own three cards, the table, and everybody's counts. Captured piles are
   face down and stay that way — a player may remember what went into them,
   which is part of the game, but the server will not do the remembering for
   them.
   ========================================================================== */
export function viewFor(state, playerId) {
  const me = playerById(state, playerId);
  return {
    game: 'ronda',
    variant: state.variant,
    round: state.round,
    hand: state.hand,
    phase: state.phase,
    target: state.target,
    house: state.house,
    turn: state.order[state.turn],
    dir: state.dir,
    dealer: state.dealer,
    table: state.table.slice(),
    deckCount: state.deck.length,
    teamScores: { ...state.teamScores },
    calls: state.calls.slice(),
    chain: state.chain ? { ...state.chain } : null,
    lastPlay: state.lastPlay ? { who: state.lastPlay.who, card: state.lastPlay.card, captured: state.lastPlay.captured } : null,
    lastCapture: state.lastCapture,
    you: me ? { id: me.id, name: me.name, team: me.team, seat: me.seat, hand: me.hand.slice(), pile: me.pile.length } : null,
    players: state.order.map(id => {
      const p = playerById(state, id);
      return {
        id: p.id, name: p.name, team: p.team, seat: p.seat,
        count: p.hand.length, pile: p.pile.length, score: p.score, connected: p.connected
      };
    }),
    roundWinner: state.roundWinner,
    winner: state.winner,
    moves: legalMoves(state, playerId)
  };
}

/* ==========================================================================
   the machines
   ========================================================================== */
export const BOT_LEVELS = ['easy', 'normal', 'sharp'];

export function botMove(state, playerId, rnd = Math.random, level = 'normal') {
  const ms = legalMoves(state, playerId);
  if (!ms.length) return null;
  if (!BOT_LEVELS.includes(level)) level = 'normal';
  const me = playerById(state, playerId);
  const card = id => me.hand.find(c => c.id === id);
  if (level === 'easy') return ms[Math.floor(rnd() * ms.length)];

  const scored = ms.map(m => {
    const c = card(m.cardId);
    if (!c) return null;
    const taken = captureWith(state.table, c.rank);
    let sc = taken.length * 12;
    if (taken.length && state.table.length === taken.length && state.variant === 'ronda') sc += 9;   /* missa */

    /* a darba is worth taking the moment it is on offer */
    const lp = state.lastPlay;
    if (taken.length && lp && !lp.captured && lp.card.rank === c.rank && teamOf(state, lp.who) !== me.team) sc += 10;
    /* and so is carrying on a chain we started */
    if (state.chain && state.chain.rank === c.rank && state.chain.team === me.team) sc += 14;

    if (!taken.length) {
      /* Leaving a card is a gift if the rank is still out there. Count what we
         can honestly see — our own hand and the table — and drop the rank that
         is least likely to be sitting in somebody else's three. */
      const seen = me.hand.filter(x => x.rank === c.rank).length + state.table.filter(x => x.rank === c.rank).length;
      sc -= 6 - seen * 2;
      /* and a low card left behind is a smaller loss than a high one, because
         a run sweeps upward from wherever it starts */
      sc -= (RANKS.length - ord(c.rank)) * 0.25;
    }
    if (level === 'normal') sc += rnd() * 7;
    return { m, sc };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc);

  return scored.length ? scored[0].m : ms[0];
}


const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PALETTE = ['#22e6ff', '#ff8a2b', '#9cff2e', '#a55bff'];

/* ==========================================================================
   PARTY — the things every CyberGrill table needs and none of them owns.

   Sound, confetti and the music bed. This file is inlined into each table page
   at build time (look for the PARTY markers), so it shares the page's scope
   and can use $ and el directly. It is deliberately not an ES module: pasting
   it in costs nothing at runtime, and one copy of a card snap serves UNO, Ludo
   and whatever comes next.

   What a page owes this file:
     #fx          a full-screen canvas for the confetti
     #musicChip   something to toggle the music with, wired up by the page
   ========================================================================== */

/* ==========================================================================
   SOUND
   --------------------------------------------------------------------------
   A card is not a beep. Everything here is built the way the real noise is
   built: a burst of noise shaped by a filter, plus a short pitched transient
   underneath it, all sitting in a small room.
   
   If you drop real recordings into the repo's audio/ folder they are used
   instead — see audio/README.md. Anything missing falls back to these.
   ========================================================================== */
let AC = null, sound = true, BUS = null, WET = null, NOISE = null;
const SAMPLES = Object.create(null);

function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
  if (AC && !BUS) buildBus();
  return AC;
}

/* a small room, made from decaying noise — without it everything sounds like
   it is happening inside your skull */
function buildBus() {
  const c = AC;
  BUS = c.createGain(); BUS.gain.value = 1; BUS.connect(c.destination);
  try {
    const len = Math.floor(c.sampleRate * 0.42);
    const ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < 60 ? i / 60 : 1);
      }
    }
    const conv = c.createConvolver(); conv.buffer = ir;
    WET = c.createGain(); WET.gain.value = 0.16;
    WET.connect(conv); conv.connect(c.destination);
  } catch (e) { WET = null; }
  /* one noise buffer, reused for every rustle and click */
  const n = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
  const nd = n.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  NOISE = n;
}

/* one shaped burst of noise: the raw material of card sounds */
function hiss(o) {
  const c = ac(); if (!c || !sound) return;
  const at = c.currentTime + (o.delay || 0);
  const src = c.createBufferSource();
  src.buffer = NOISE;
  src.loop = true;
  src.playbackRate.value = 0.7 + Math.random() * 0.6;
  const f = c.createBiquadFilter();
  f.type = o.type || 'bandpass';
  f.frequency.setValueAtTime(o.f1, at);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f2), at + o.dur);
  f.Q.value = o.q === undefined ? 1.1 : o.q;
  const g = c.createGain();
  const peak = (o.gain === undefined ? .18 : o.gain);
  const rise = o.rise === undefined ? .006 : o.rise;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + rise);
  g.gain.exponentialRampToValueAtTime(0.0001, at + o.dur);
  src.connect(f); f.connect(g); g.connect(BUS);
  if (WET && o.room !== false) g.connect(WET);
  src.start(at + Math.random() * 0.02);
  src.stop(at + o.dur + .05);
}

/* a short pitched body — the thump under a slap, the wood in a click */
function body(o) {
  const c = ac(); if (!c || !sound) return;
  const at = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f1, at);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), at + o.dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(o.gain === undefined ? .12 : o.gain, at + (o.rise || .004));
  g.gain.exponentialRampToValueAtTime(0.0001, at + o.dur);
  osc.connect(g); g.connect(BUS);
  if (WET && o.room !== false) g.connect(WET);
  osc.start(at); osc.stop(at + o.dur + .05);
}

/* kept for the music, which is written in notes rather than noise */
function tone(f, d, t, v, dl, slide) {
  if (!sound) return; const c = ac(); if (!c) return;
  const t0 = c.currentTime + (dl || 0), o = c.createOscillator(), g = c.createGain();
  o.type = t || 'triangle'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v || .1, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(BUS || c.destination);
  if (WET) g.connect(WET);
  o.start(t0); o.stop(t0 + d + .03);
}

/* a real recording, if one was dropped in for this event */
function sample(name, gain) {
  const c = ac(); if (!c || !sound) return false;
  const buf = SAMPLES[name]; if (!buf) return false;
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = gain === undefined ? 1 : gain;
  src.connect(g); g.connect(BUS);
  src.start();
  return true;
}

const SFX = {
  /* a card snapping down on the pile */
  play() {
    if (sample('play')) return;
    hiss({ f1: 5200, f2: 1400, dur: .07, q: .7, gain: .3 });
    body({ f1: 260, f2: 90, dur: .06, gain: .09, type: 'triangle' });
  },
  /* one card dragged off the deck */
  draw() {
    if (sample('draw')) return;
    hiss({ f1: 1100, f2: 3400, dur: .09, q: 1.6, gain: .16, rise: .03 });
    hiss({ f1: 4200, f2: 1200, dur: .05, q: .8, gain: .12, delay: .07 });
  },
  /* the whole deck riffled */
  shuffle() {
    if (sample('shuffle')) return;
    for (let i = 0; i < 14; i++)
      hiss({ f1: 1800 + Math.random() * 2600, dur: .045, q: 2.2, gain: .07, delay: i * .028 + Math.random() * .012 });
  },
  /* somebody loses their turn */
  skip() {
    if (sample('skip')) return;
    hiss({ f1: 400, f2: 2600, dur: .13, q: 2.4, gain: .16, rise: .05 });
    body({ f1: 180, f2: 70, dur: .16, gain: .1, type: 'triangle', delay: .1 });
  },
  /* the table turns around */
  rev() {
    if (sample('rev')) return;
    hiss({ f1: 500, f2: 3200, dur: .22, q: 3.2, gain: .13, rise: .12 });
    hiss({ f1: 3200, f2: 500, dur: .2, q: 3.2, gain: .11, rise: .06, delay: .2 });
  },
  /* a +2 or +4 landing on somebody */
  hit() {
    if (sample('hit')) return;
    body({ f1: 150, f2: 42, dur: .3, gain: .2, type: 'sine' });
    hiss({ f1: 2600, f2: 600, dur: .13, q: .6, gain: .22 });
  },
  /* the shout */
  uno() {
    if (sample('uno')) return;
    hiss({ f1: 3000, f2: 900, dur: .09, q: .5, gain: .2 });
    [784, 1047, 1319].forEach((f, i) => body({ f1: f, dur: .3, gain: .075, type: 'triangle', delay: i * .055, rise: .008 }));
  },
  /* the round is over */
  win() {
    if (sample('win')) return;
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      body({ f1: f, dur: .5, gain: .085, type: 'triangle', delay: i * .085, rise: .01 });
      body({ f1: f * 2, dur: .3, gain: .03, type: 'sine', delay: i * .085 });
    });
    /* the room reacting */
    for (let i = 0; i < 26; i++)
      hiss({ f1: 1400 + Math.random() * 3000, dur: .07, q: 1.8, gain: .045, delay: .12 + Math.random() * .8 });
  },
  /* that will not go down */
  bad() {
    if (sample('bad')) return;
    body({ f1: 130, f2: 74, dur: .17, gain: .14, type: 'triangle' });
    hiss({ f1: 700, f2: 300, dur: .09, q: 1.4, gain: .08 });
  },
  /* a small wooden click for the interface */
  tick() {
    if (sample('tick')) return;
    hiss({ f1: 2600, dur: .022, q: 2.6, gain: .1, room: false });
    body({ f1: 900, f2: 520, dur: .025, gain: .035, type: 'triangle', room: false });
  }
};

/* Real recordings win over anything generated. Drop 44.1k mp3 or ogg files
   named after the events above into audio/ and they are picked up here; the
   game keeps working exactly as before if the folder is empty. */
const SAMPLE_NAMES = ['play', 'draw', 'shuffle', 'skip', 'rev', 'hit', 'uno', 'win', 'bad', 'tick'];
/* every table page sits one folder below the site root except the nested ones,
   which say so by setting window.CG_AUDIO before this runs */
const AUDIO_DIR = window.CG_AUDIO || '../audio/';
/* A page opened straight off the disk cannot fetch its neighbours, and the
   browser logs a CORS complaint for every attempt. There is nothing to load
   there, so do not ask. */
const canLoadFiles = () => location.protocol === 'http:' || location.protocol === 'https:';
let audioManifest = null;
async function getManifest() {
  if (audioManifest) return audioManifest;
  try {
    const r = await fetch(AUDIO_DIR + 'manifest.json', { cache: 'force-cache' });
    audioManifest = r.ok ? await r.json() : [];
  } catch (e) { audioManifest = []; }
  return audioManifest;
}
async function loadSamples() {
  const c = ac(); if (!c || !canLoadFiles()) return;
  const have = await getManifest();
  if (!have.length) return;
  await Promise.all(SAMPLE_NAMES.map(async n => {
    const file = ['mp3', 'ogg', 'wav'].map(e => n + '.' + e).find(f => have.indexOf(f) !== -1);
    if (!file) return;
    try {
      const r = await fetch(AUDIO_DIR + file, { cache: 'force-cache' });
      if (!r.ok) return;
      SAMPLES[n] = await c.decodeAudioData(await r.arrayBuffer());
    } catch (e) { /* the generated one stands in */ }
  }));
}

/* ---------------- confetti ---------------- */
const cv = $('#fx'), ctx = cv.getContext('2d');
let parts = [];
function fit() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', fit); fit();
function burst(x, y, n, colors) {
  for (let i = 0; i < (n || 40); i++) {
    const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 10;
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, g: .25 + Math.random() * .15,
      life: 1, dec: .008 + Math.random() * .01, c: (colors || PALETTE)[(Math.random() * (colors || PALETTE).length) | 0],
      w: 4 + Math.random() * 7, h: 4 + Math.random() * 11, r: Math.random() * 6, vr: (Math.random() - .5) * .4
    });
  }
}
(function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 60);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99; p.r += p.vr; p.life -= p.dec;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.shadowBlur = 10; ctx.shadowColor = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
  requestAnimationFrame(loop);
})();

/* ==========================================================================
   THE BED
   --------------------------------------------------------------------------
   A four-bar loop built out of oscillators, scheduled a beat ahead so it does
   not stutter. It sits almost out of hearing until somebody drops to one
   card, and then a second layer creeps in on top.
   ========================================================================== */
const music = (() => {
  const BPM = 88, BEAT = 60 / BPM, BAR = BEAT * 4;
  /* Am - F - C - G, an old friend, transposed low */
  const PROG = [
    { root: 55.00, ch: [220.00, 261.63, 329.63] },   /* A minor  */
    { root: 43.65, ch: [174.61, 220.00, 261.63] },   /* F major  */
    { root: 65.41, ch: [196.00, 261.63, 329.63] },   /* C major  */
    { root: 49.00, ch: [196.00, 246.94, 293.66] }    /* G major  */
  ];
  let on = false, master = null, bedGain = null, tenseGain = null,
      timer = null, next = 0, bar = 0, tenseWanted = false, fileBed;

  function build() {
    const c = ac(); if (!c) return false;
    master = c.createGain(); master.gain.value = 0; master.connect(c.destination);
    bedGain = c.createGain(); bedGain.gain.value = 1; bedGain.connect(master);
    tenseGain = c.createGain(); tenseGain.gain.value = 0; tenseGain.connect(master);
    return true;
  }

  function voice(dest, type, freq, at, dur, peak, detune) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(peak, at + dur * .22);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    o.connect(g); g.connect(dest); o.start(at); o.stop(at + dur + .05);
  }

  function scheduleBar(at) {
    const c = ac(); if (!c) return;
    const P = PROG[bar % PROG.length];

    /* bass, on the one and the three */
    voice(bedGain, 'sine', P.root, at, BEAT * 1.7, .10);
    voice(bedGain, 'sine', P.root, at + BEAT * 2, BEAT * 1.7, .075);
    voice(bedGain, 'triangle', P.root * 2, at, BEAT * 1.2, .022);

    /* a pad that just hangs there */
    P.ch.forEach((f, i) => {
      voice(bedGain, 'triangle', f, at, BAR * .96, .018, i * 4 - 4);
      voice(bedGain, 'sine', f * 2, at, BAR * .9, .006);
    });

    /* the tense layer: an eighth-note arpeggio that only gets through when
       tenseGain is open */
    for (let i = 0; i < 8; i++) {
      const f = P.ch[i % P.ch.length] * (i > 4 ? 2 : 1);
      voice(tenseGain, 'square', f, at + i * BEAT / 2, BEAT * .34, .028);
    }
    /* and a quiet tick on every beat, so the loop has a pulse */
    for (let i = 0; i < 4; i++) voice(bedGain, 'sine', 1800, at + i * BEAT, .035, i === 0 ? .012 : .006);

    bar++;
  }

  function pump() {
    const c = ac(); if (!c) return;
    while (next < c.currentTime + .6) {
      if (next < c.currentTime) next = c.currentTime + .06;
      scheduleBar(next);
      next += BAR;
    }
  }

  return {
    get on() { return on; },
    toggle() { on ? this.stop() : this.start(); return on; },
    /* If audio/music.mp3 is there, play that instead of building a loop out of
       oscillators. audio/music-tense.mp3 becomes the layer that fades in when
       somebody is one card away. */
    async useFiles() {
      const c = ac(); if (!c || !master) return false;
      if (fileBed !== undefined) return !!fileBed;
      fileBed = null;
      if (!canLoadFiles()) return false;
      const have = await getManifest();
      for (const [name, dest] of [['music', 'bed'], ['music-tense', 'tense']]) {
        for (const ext of ['mp3', 'ogg']) {
          if (have.indexOf(name + '.' + ext) === -1) continue;
          try {
            const r = await fetch(AUDIO_DIR + name + '.' + ext, { cache: 'force-cache' });
            if (!r.ok) continue;
            const buf = await c.decodeAudioData(await r.arrayBuffer());
            const src = c.createBufferSource();
            src.buffer = buf; src.loop = true;
            src.connect(dest === 'bed' ? bedGain : tenseGain);
            src.start();
            if (dest === 'bed') fileBed = src;
            break;
          } catch (e) { }
        }
      }
      return !!fileBed;
    },
    start() {
      const c = ac(); if (!c) return;
      if (!master && !build()) return;
      on = true;
      this.useFiles().then(usingFiles => { if (usingFiles) { clearInterval(timer); timer = null; } });
      master.gain.cancelScheduledValues(c.currentTime);
      master.gain.setValueAtTime(master.gain.value, c.currentTime);
      master.gain.linearRampToValueAtTime(.6, c.currentTime + 1.4);
      next = c.currentTime + .08;
      pump();
      clearInterval(timer); timer = setInterval(pump, 200);
    },
    stop() {
      const c = ac(); if (!c || !master) { on = false; return; }
      on = false;
      master.gain.cancelScheduledValues(c.currentTime);
      master.gain.setValueAtTime(master.gain.value, c.currentTime);
      master.gain.linearRampToValueAtTime(0, c.currentTime + .5);
      clearInterval(timer); timer = null;
    },
    /* somebody is one card away — lean on it */
    tense(v) {
      tenseWanted = !!v;
      const c = ac(); if (!c || !tenseGain) return;
      tenseGain.gain.cancelScheduledValues(c.currentTime);
      tenseGain.gain.setValueAtTime(tenseGain.gain.value, c.currentTime);
      tenseGain.gain.linearRampToValueAtTime(v ? 1 : 0, c.currentTime + (v ? 1.6 : 1.1));
    },
    sting() {   /* a short lift at the end of a round */
      [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .08, i * .09));
    }
  };
})();

/* ==========================================================================
   LA BARAJA ESPAÑOLA
   --------------------------------------------------------------------------
   Forty cards, four suits, drawn rather than photographed so they stay crisp
   at any size and can be recoloured for the arcade.

   The detail worth knowing: the breaks in the border are called *pintas*, and
   they are how you read a Spanish deck fanned in somebody's hand — oros has an
   unbroken frame, copas one break per side, espadas two, bastos three. They
   are drawn here for the same reason they exist on the real cards.
   ========================================================================== */
const PINTAS = { o: 0, c: 1, e: 2, b: 3 };

const DECKS = {
  classic: {
    key: 'classic', icon: '🃏', name: 'ESPAÑOLA',
    card: '#f4ecd8', ink: '#2b2417', frame: '#7a6844',
    suit: { o: '#d19a1a', c: '#b8342a', e: '#2a63a8', b: '#4a7c3a' },
    glow: false
  },
  neon: {
    key: 'neon', icon: '✨', name: 'NEÓN',
    card: '#0d1230', ink: '#e8ecff', frame: 'rgba(120,140,255,.55)',
    suit: { o: '#ffc93c', c: '#ff2fb9', e: '#22e6ff', b: '#9cff2e' },
    glow: true
  }
};
let deckTheme = 'classic';
const D = () => DECKS[deckTheme] || DECKS.classic;

/* --- the four suits, each drawn around its own origin --- */
function suitPath(suit, col, ink) {
  switch (suit) {
    case 'o':   /* oros — a coin */
      return '<g><circle r="9.2" fill="' + col + '"/>' +
        '<circle r="9.2" fill="none" stroke="' + ink + '" stroke-opacity=".35" stroke-width=".9"/>' +
        '<circle r="6" fill="none" stroke="' + ink + '" stroke-opacity=".45" stroke-width=".9"/>' +
        '<circle r="2.1" fill="' + ink + '" fill-opacity=".45"/></g>';
    case 'c':   /* copas — a goblet */
      return '<g fill="' + col + '">' +
        '<path d="M-7.4,-9.5 L7.4,-9.5 L6,-1.5 A6,6 0 0 1 -6,-1.5 Z"/>' +
        '<rect x="-1.3" y="1" width="2.6" height="5.4"/>' +
        '<ellipse cx="0" cy="8" rx="5.8" ry="1.9"/>' +
        '<rect x="-7.4" y="-10.6" width="14.8" height="1.6" rx=".8"/></g>';
    case 'e':   /* espadas — a sword */
      return '<g fill="' + col + '">' +
        '<path d="M0,-11.5 L2.1,-7.5 L2.1,2.6 L-2.1,2.6 L-2.1,-7.5 Z"/>' +
        '<rect x="-6.6" y="2.6" width="13.2" height="2.1" rx="1"/>' +
        '<rect x="-1.3" y="4.7" width="2.6" height="4.4"/>' +
        '<circle cy="10.2" r="1.9"/></g>';
    default:    /* bastos — a club */
      return '<g fill="' + col + '" transform="rotate(12)">' +
        '<path d="M-2.2,10.5 L-3.1,-2.4 Q0,-11.5 3.1,-2.4 L2.2,10.5 Z"/>' +
        '<circle cx="-3.4" cy="1.2" r="1.9"/><circle cx="3.4" cy="4.4" r="1.9"/>' +
        '<circle cx="-3" cy="7.2" r="1.6"/></g>';
  }
}

/* --- the three figures: page, horseman, king --- */
function figure(rank, col, ink) {
  if (rank === 10)      /* sota — the page, standing with a staff */
    return '<g fill="' + col + '">' +
      '<path d="M-6.5,-22 L6.5,-22 L8,-17.5 L-8,-17.5 Z"/>' +
      '<circle cx="0" cy="-12" r="6.4"/>' +
      '<path d="M-11.5,13 Q-11.5,-4 0,-4 Q11.5,-4 11.5,13 Z"/>' +
      '<rect x="9.5" y="-16" width="1.9" height="29" rx=".9"/>' +
      '<circle cx="10.4" cy="-17.5" r="2.4"/>' +
      '<path d="M-11.5,13 L11.5,13 L10,16 L-10,16 Z" opacity=".75"/></g>';
  if (rank === 11)      /* caballo — the horseman, drawn as the horse's head */
    return '<g fill="' + col + '">' +

/* the pip layouts, on a 100 x 150 card */
const PIPS = {
  1: [[50, 75]],
  2: [[50, 45], [50, 105]],
  3: [[50, 40], [50, 75], [50, 110]],
  4: [[33, 46], [67, 46], [33, 104], [67, 104]],
  5: [[33, 46], [67, 46], [50, 75], [33, 104], [67, 104]],
  6: [[33, 40], [67, 40], [33, 75], [67, 75], [33, 110], [67, 110]],
  7: [[33, 38], [67, 38], [50, 57], [33, 75], [67, 75], [33, 112], [67, 112]]
};

function cardSVG(card, t) {
  t = t || D();
  const col = t.suit[card.suit], ink = t.ink;
  const g = t.glow ? ' filter="url(#cgGlow)"' : '';
  let out = '<svg class="cf" viewBox="0 0 100 150" preserveAspectRatio="none">' +
    '<rect x="0" y="0" width="100" height="150" rx="9" fill="' + t.card + '"/>';

  /* the frame, with the suit's pintas cut out of it */
  out += '<rect x="6" y="6" width="88" height="138" rx="6" fill="none" stroke="' + t.frame + '" stroke-width="1.8"/>';
  const n = PINTAS[card.suit];
  for (let i = 0; i < n; i++) {
    const f = (i + 1) / (n + 1);
    out += '<rect x="' + (6 + 88 * f - 5) + '" y="4.2" width="10" height="3.6" fill="' + t.card + '"/>';
    out += '<rect x="' + (6 + 88 * f - 5) + '" y="142.2" width="10" height="3.6" fill="' + t.card + '"/>';
    out += '<rect x="4.2" y="' + (6 + 138 * f - 5) + '" width="3.6" height="10" fill="' + t.card + '"/>';
    out += '<rect x="92.2" y="' + (6 + 138 * f - 5) + '" width="3.6" height="10" fill="' + t.card + '"/>';
  }

  /* the middle */
  if (card.rank >= 10) {
    out += '<g' + g + ' transform="translate(50,70) scale(1.45)">' + figure(card.rank, col, ink) + '</g>';
    out += '<g transform="translate(50,24) scale(.62)">' + suitPath(card.suit, col, ink) + '</g>';
    out += '<text x="50" y="130" font-size="10.5" fill="' + ink + '" fill-opacity=".7" text-anchor="middle" ' +
      'font-weight="900" letter-spacing="1.5">' + RANK_NAME[card.rank] + '</text>';
  } else {
    const pips = PIPS[card.rank] || [];
    const scale = card.rank === 1 ? 1.9 : card.rank === 2 || card.rank === 3 ? 1.35 : 1.05;
    out += '<g' + g + '>' + pips.map(([x, y]) =>
      '<g transform="translate(' + x + ',' + y + ') scale(' + scale + ')">' + suitPath(card.suit, col, ink) + '</g>'
    ).join('') + '</g>';
  }

  /* the rank in two corners, the way you read a fanned hand */
  const lbl = String(card.rank);
  out += '<text x="15" y="26" font-size="19" fill="' + ink + '" text-anchor="middle" font-weight="900">' + lbl + '</text>';
  out += '<text x="85" y="126" font-size="19" fill="' + ink + '" text-anchor="middle" font-weight="900" ' +
    'transform="rotate(180 85 126)">' + lbl + '</text>';
  return out + '</svg>';
}

function cardBackSVG(t) {
  t = t || D();
  return '<svg class="cf" viewBox="0 0 100 150" preserveAspectRatio="none">' +
    '<rect x="0" y="0" width="100" height="150" rx="9" fill="#5a2130"/>' +
    '<rect x="6" y="6" width="88" height="138" rx="6" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.6"/>' +
    '<g fill="rgba(255,255,255,.13)">' +
    [22, 52, 82, 112].map(y => [24, 50, 76].map(x =>
      '<circle cx="' + x + '" cy="' + y + '" r="7"/>').join('')).join('') + '</g></svg>';
}

const myView = () => NET ? NET.view : viewFor(G, ME);
function seatColor(p) { return p.team === 'A' ? 'var(--cyan)' : 'var(--orange)'; }

/* where each opponent sits, relative to me, once I am at the bottom */
function seatSlots(v) {
  const n = v.players.length;
  const mine = v.players.findIndex(p => p.id === ME);
  const out = [];
  for (let k = 1; k < n; k++) {
    const p = v.players[(mine + k) % n];
    out.push({ p, where: n === 2 ? 'top' : (k === 1 ? 'right' : k === 2 ? 'top' : 'left') });
  }
  return out;
}

function render() {
  if (!G) return;

  const felt = $('#felt');

    const s = el('div', 'rSeat ' + where + (v.turn === p.id ? ' turn' : '') +

  /* my three */

/* light up what a card would take, before you commit to it */
function preview(taken) {
  const ids = new Set(taken.map(c => c.id));
  $('#mesa').querySelectorAll('.rcard').forEach(d => d.classList.toggle('willTake', ids.has(d.dataset.cid)));
}

/* ==========================================================================
   playing
   ========================================================================== */
function play(cardId) {
  if (!G || animating) return;
  if (busy && !NET) return;
  preview([]);
  if (NET) { netSend({ t: 'move', move: { type: 'play', cardId } }); return; }
  try {
    const r = applyMove(G, ME, { type: 'play', cardId });
    G = r.state;
    after(r.events);
  } catch (e) { SFX.bad(); logLine('⚠ ' + e.message); }
}

function after(events) {
  const cap = events.find(e => e.t === 'capture');
  showEvents(events);
  const done = () => {
    render();
    if (G.phase !== 'playing') return showRoundEnd();
    if (!busy) tickBots();
  };
  if (cap && cap.taken.length) {
    /* let the captured cards slide off the table before redrawing it */
    animating = true;
    const ids = new Set(cap.taken.map(c => c.id));
    $('#mesa').querySelectorAll('.rcard').forEach(d => { if (ids.has(d.dataset.cid)) d.classList.add('taking'); });
    setTimeout(() => { animating = false; done(); }, 420);
  } else done();
}

function tickBots() {
  if (NET || !G || G.phase !== 'playing') return;
  const who = G.order[G.turn];
  if (who === ME) return;
  busy = true;
  setTimeout(() => {
    if (!G || G.phase !== 'playing') { busy = false; return; }
    const m = botMove(G, who, Math.random, cfg.skill);
    if (!m) { busy = false; return; }
    let r;
    try { r = applyMove(G, who, m); } catch (e) { busy = false; return; }
    G = r.state; busy = false;
    after(r.events);
  }, speedMs());
}

   ========================================================================== */
function nameOf(id) { const p = (G.players || []).find(x => x.id === id); return p ? p.name : '?'; }
function logLine(t) {
  const l = $('#log');
  l.insertBefore(el('div', null, t), l.firstChild);
  while (l.children.length > (innerWidth < 700 ? 3 : 6)) l.removeChild(l.lastChild);
}
function callOut(word, sub) {
  /* the last events of a round arrive with the round-end card, and a shout
     landing on top of it just makes both unreadable */
  if ($('#roundOvl').classList.contains('show')) return;
  const d = el('div', 'callOut', '<b>' + esc(word) + '</b><span>' + esc(sub || '') + '</span>');
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1600);
}
const clearCallOuts = () => document.querySelectorAll('.callOut').forEach(e => e.remove());

function showEvents(evs) {
  (evs || []).forEach(e => {
    switch (e.t) {
      case 'deal':
        SFX.shuffle();
        logLine('🂠 three each — ' + e.left + ' left in the deck');
        break;
      case 'bury':
        logLine('↩️ ' + cardName(e.card) + ' buried, the table has to start dead');
        break;
      case 'call': {
        const label = e.kind === 'tringa' ? 'TRINGA' : 'RONDA';
        if (e.points > 0) {
          SFX.uno();
          callOut(label, nameOf(e.who) + ' · ' + e.rank + 's · +' + e.points);
          burst(innerWidth / 2, innerHeight * .38, 30, ['#ffc93c', '#fff']);
          logLine('📣 ' + nameOf(e.who) + ' calls ' + label + ' on the ' + e.rank + 's — ' + e.points);
        } else {
          logLine('📣 ' + nameOf(e.who) + ' calls ' + label + ' on the ' + e.rank + 's — beaten');
        }
        break;
      }
      case 'capture':
        SFX.play();
        logLine('✋ ' + nameOf(e.who) + ' plays the ' + e.card.rank + ' and takes ' +
          e.taken.map(c => c.rank).join(', ') + (e.run ? ' — a run' : ''));
        break;
      case 'drop':
        SFX.draw();
        logLine('🃏 ' + nameOf(e.who) + ' leaves the ' + e.card.rank);
        break;
      case 'darba':
        SFX.hit();
        callOut('DARBA', nameOf(e.who) + (e.points ? ' · +' + e.points : ''));
        logLine('👊 DARBA — ' + nameOf(e.who) + ' takes the ' + e.rank + ' straight back' + (e.points ? ' (+' + e.points + ')' : ''));
        break;
      case 'khamsa':
        SFX.win();
        callOut("B'KHAMSA", nameOf(e.who) + ' · +' + e.points);
        burst(innerWidth / 2, innerHeight * .4, 40, ['#ffc93c', '#ff8a2b']);
        logLine("🔥 B'KHAMSA — the third " + e.rank + ' (+' + e.points + ')');
        break;
      case 'ashra':
        SFX.win();
        callOut("B'ASHRA", nameOf(e.who) + ' · +' + e.points);
        for (let i = 0; i < 4; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .4, 40), i * 130);
        logLine("💥 B'ASHRA — all four " + e.rank + 's (+' + e.points + ')');
        break;
      case 'chainBroken': logLine('🔗 the chain on the ' + e.rank + ' is broken'); break;
      case 'missa':
        if (e.points) { SFX.uno(); callOut('MISSA', nameOf(e.who) + ' · +' + e.points); logLine('🧹 MISSA — ' + nameOf(e.who) + ' clears the table (+' + e.points + ')'); }
        else logLine('🧹 table cleared — no missa on the last hand');
        break;
      case 'bawesh':
        SFX.rev();
        logLine('🧺 BAWESH — ' + nameOf(e.who) + ' sweeps the last ' + e.cards.length);
        break;
      case 'count':
        logLine('🔢 A ' + e.counts.A + ' cards (+' + e.gained.A + ') · B ' + e.counts.B + ' cards (+' + e.gained.B + ')');
        break;
    }
  });
}
